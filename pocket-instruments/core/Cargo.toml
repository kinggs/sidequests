[package]
name = "pi-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pocket Instruments: the shared engine. no_std, no allocator, a C ABI."
publish = false

# No dependencies, on purpose: nothing can bring an allocator in (P1).

[lib]
name = "pi_core"
# staticlib for Rack and the C++ harness, cdylib for WebAssembly. The Makefile asks for one
# at a time (`cargo rustc --crate-type`).
crate-type = ["staticlib", "cdylib"]
doctest = false

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom on a phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
body{margin:0}
button{border:0;padding:0;margin:0;font:inherit;cursor:pointer}
.k{height:88px;background:#2B2942;color:#F2E8D0;font-weight:800;font-size:28px}
.k.on{background:#F2E8D0;color:#14131F}
.k.play{box-shadow:inset 0 0 0 7px #F0B429}
.k.on.play{box-shadow:inset 0 0 0 7px #F0B429,inset 0 0 0 12px #14131F}
.k.ghost{background:linear-gradient(#F2E8D0,#F2E8D0) right 9px top 9px / 13px 13px no-repeat #2B2942}
.k.on.ghost{background:linear-gradient(#14131F,#14131F) right 9px top 9px / 13px 13px no-repeat #F2E8D0}
.f{height:151px;box-sizing:border-box;background:#2B2942;color:#F2E8D0;border-top:12px solid #F2E8D0;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.f span{writing-mode:vertical-rl;transform:rotate(180deg)}
.f.latch{background:#F2E8D0;color:#14131F}
.s{height:6px;background:#6E6A92;align-self:end}
.s.q{height:10px}
.s.now{height:16px;background:#F0B429}
.sl{width:44px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:18px;font-weight:800}
.tr{position:relative;flex:1;width:6px;background:#F2E8D0}
.cap{position:absolute;left:-19px;width:44px;height:26px;box-sizing:border-box;background-color:#14131F;border-top:10px solid #F2E8D0;border-bottom:10px solid #F2E8D0}
</style>
</head>
<body style="background: #07060C">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 6px; background: #07060C; font-family: 'JetBrains Mono', ui-monospace, monospace">
<div style="height: 832px; box-sizing: border-box; padding: 8px; background: #14131F; border: 2px dashed #6E6A92; color: #F2E8D0; display: flex; flex-direction: column; gap: 12px">

<div style="height: 124px; box-sizing: border-box; background: #0B0A12; border: 2px solid #F2E8D0; padding: 8px 10px; display: flex; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<svg role="img" aria-label="A cloth being woven: two finished diamonds, a third half made" viewBox="0 0 216 76" preserveAspectRatio="none" style="width: 100%; height: 76px">
<defs><pattern id="wvP" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H6M0 0V6" stroke="#0B0A12" stroke-width="1.6" fill="none"/></pattern></defs>
<rect x="0" y="0" width="150" height="76" fill="#2B2942"/>
<g fill="#F0654A"><polygon points="36,2 72,38 36,74 0,38"/><polygon points="108,2 144,38 108,74 72,38"/><polygon points="180,2 216,38 180,74 144,38"/></g>
<g fill="#F0B429"><polygon points="36,18 56,38 36,58 16,38"/><polygon points="108,18 128,38 108,58 88,38"/><polygon points="180,18 200,38 180,58 160,38"/></g>
<g fill="#F2E8D0"><polygon points="36,29 45,38 36,47 27,38"/><polygon points="108,29 117,38 108,47 99,38"/></g>
<rect x="0" y="0" width="216" height="76" fill="url(#wvP)"/>
<rect x="156" y="0" width="60" height="76" fill="#0B0A12"/>
<path d="M162 6H216M162 16H216M162 26H216M162 36H216M162 46H216M162 56H216M162 66H216" stroke="#6E6A92" stroke-width="1.4" fill="none"/>
<rect x="156" y="0" width="8" height="76" fill="#F0B429"/>
<rect x="174" y="0" width="3" height="46" fill="#F2E8D0"/>
<rect x="170" y="40" width="11" height="20" fill="#F2E8D0"/>
</svg>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; height: 16px">
<span class="s q"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s q"></span><span class="s"></span><span class="s now"></span><span class="s"></span><span class="s q"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s q"></span><span class="s"></span><span class="s"></span><span class="s"></span>
</div>
</div>
<div style="width: 104px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end">
<div style="display: flex; align-items: baseline; gap: 5px">
<span style="font-size: 42px; font-weight: 800; line-height: .9">120</span>
<span style="font-size: 16px; font-weight: 800; color: #C9C2DD">bpm</span>
</div>
<span style="font-size: 16px; font-weight: 800">step 07</span>
<span style="font-size: 16px; font-weight: 800; background: #F0B429; color: #14131F; padding: 1px 8px">write</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px">
<button class="k on">1</button><button class="k">2</button><button class="k ghost">3</button><button class="k">4</button>
<button class="k on ghost">5</button><button class="k">6</button><button class="k on play">7</button><button class="k">8</button>
<button class="k on">9</button><button class="k">10</button><button class="k on">11</button><button class="k">12</button>
<button class="k on">13</button><button class="k">14</button><button class="k ghost">15</button><button class="k">16</button>
</div>

<div style="flex: 1; min-height: 0; display: flex; gap: 10px">
<div style="width: 96px; display: flex; justify-content: space-between">
<div class="sl"><div class="tr"><span class="cap" style="top: 70px"></span></div><span>A</span></div>
<div class="sl"><div class="tr"><span class="cap" style="top: 170px"></span></div><span>B</span></div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<button class="f" style="border-top-color: #F0654A"><span>sound</span></button>
<button class="f" style="border-top-color: #F0B429"><span>pattern</span></button>
<button class="f" style="border-top-color: #8FAAF7"><span>bpm</span></button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<button class="f"><span>function</span></button>
<button class="f"><span>fx</span></button>
<button class="f latch"><span>play</span></button>
<button class="f latch"><span>write</span></button>
</div>
</div>
</div>
</div>
</div>
</body>
</html>

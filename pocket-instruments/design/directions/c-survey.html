<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction C, Survey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
body{margin:0}
button{border:0;padding:0;margin:0;font:inherit;cursor:pointer}
.k,.f{clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.k{height:45px;background:#FAFBF9;color:#14233B;font-weight:600;font-size:16px}
.k.on{background:#14233B;color:#FFFFFF}
.k.play{background:#F47A2A;color:#14233B;box-shadow:inset 0 0 0 4px #14233B}
.f{height:36px;background:#FAFBF9}
.f.latch{background:#14233B;box-shadow:inset 0 -8px 0 #F47A2A}
.fl{display:grid;gap:4px;font-size:10.5px;font-weight:600;text-align:center;color:#14233B;line-height:1}
.s{width:1px;height:5px;background:#9FD9C2;justify-self:center}
.s.q{height:9px}
.s.now{width:5px;height:12px;background:#F47A2A}
.sc{position:absolute;width:14px;height:8px;border-radius:4px;background:#14233B}
.j{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#14233B}
.jn{width:32px;height:32px;border-radius:50%;background:#FAFBF9;box-shadow:inset 0 0 0 1.5px #14233B;display:flex;align-items:center;justify-content:center}
.jh{width:14px;height:14px;border-radius:50%;background:#14233B}
</style>
</head>
<body style="background: #07060C">
<div style="position: relative; width: 488px; height: 514px; box-sizing: border-box; padding: 28px 20px; background: #DDE2DE; color: #14233B; font-family: 'Barlow Condensed', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<span class="sc" aria-hidden="true" style="left: 14px; top: 8px"></span>
<span class="sc" aria-hidden="true" style="right: 14px; top: 8px"></span>
<span class="sc" aria-hidden="true" style="left: 14px; bottom: 8px"></span>
<span class="sc" aria-hidden="true" style="right: 14px; bottom: 8px"></span>

<div style="height: 100px; box-sizing: border-box; background: #0D1F1B; padding: 10px 14px 8px; display: flex; flex-direction: column; gap: 6px">
<div style="flex: 1; min-height: 0; display: flex; gap: 14px; align-items: center">
<svg role="img" aria-label="A contour map with two peaks" viewBox="0 0 300 62" style="flex: 1; min-width: 0; height: 62px">
<g fill="none" stroke="#9FD9C2" stroke-width="1.1">
<ellipse cx="150" cy="33" rx="144" ry="27" transform="rotate(-2 150 33)"/>
<ellipse cx="138" cy="32" rx="118" ry="22" transform="rotate(-3 138 32)"/>
<ellipse cx="100" cy="31" rx="62" ry="17" transform="rotate(-5 100 31)"/>
<ellipse cx="94" cy="30" rx="44" ry="12" transform="rotate(-6 94 30)"/>
<ellipse cx="90" cy="29" rx="27" ry="7.5" transform="rotate(-6 90 29)"/>
<ellipse cx="88" cy="29" rx="11" ry="3.4" transform="rotate(-6 88 29)"/>
<ellipse cx="214" cy="35" rx="34" ry="12" transform="rotate(6 214 35)"/>
<ellipse cx="216" cy="35" rx="19" ry="6.5" transform="rotate(6 216 35)"/>
</g>
<g stroke="#F47A2A" stroke-width="1.6" fill="none"><path d="M88 21V37M80 29H96"/><circle cx="88" cy="29" r="5"/></g>
</svg>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<div style="display: flex; align-items: baseline; gap: 4px">
<span style="font-size: 44px; font-weight: 700; line-height: .9; color: #EAF6F0">120</span>
<span style="font-size: 12px; font-weight: 600; color: #9FD9C2">bpm</span>
</div>
<div style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #F47A2A">
<svg aria-hidden="true" viewBox="0 0 10 10" style="width: 9px; height: 9px"><polygon points="0,0 10,5 0,10" fill="#F47A2A"/></svg>
<span>write</span>
</div>
</div>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); height: 12px; align-items: end; border-bottom: 1px solid #9FD9C2">
<span class="s q"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s q"></span><span class="s now"></span><span class="s"></span><span class="s"></span><span class="s q"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s q"></span><span class="s"></span><span class="s"></span><span class="s"></span>
</div>
</div>

<div style="height: 192px; display: flex; justify-content: space-between">
<div style="width: 192px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; align-content: space-between">
<button class="k on">1</button><button class="k">2</button><button class="k">3</button><button class="k">4</button>
<button class="k on">5</button><button class="k play">6</button><button class="k on">7</button><button class="k">8</button>
<button class="k on">9</button><button class="k">10</button><button class="k on">11</button><button class="k">12</button>
<button class="k on">13</button><button class="k">14</button><button class="k">15</button><button class="k">16</button>
</div>
<span aria-hidden="true" style="width: 1px; background: #14233B"></span>
<div style="width: 48px; display: flex; justify-content: space-between">
<div style="width: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="position: relative; flex: 1; width: 22px; background: repeating-linear-gradient(to bottom, #14233B 0, #14233B 1px, transparent 1px, transparent 8px) left / 5px 100% no-repeat">
<span style="position: absolute; left: 9px; top: 0; bottom: 0; width: 5px; background: #14233B"></span>
<span style="position: absolute; left: 2px; top: 44px; width: 20px; height: 12px; background: #F47A2A; box-shadow: inset 0 0 0 1.5px #14233B"></span>
</div>
<span style="font-size: 14px; font-weight: 700; line-height: 1">A</span>
</div>
<div style="width: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="position: relative; flex: 1; width: 22px; background: repeating-linear-gradient(to bottom, #14233B 0, #14233B 1px, transparent 1px, transparent 8px) left / 5px 100% no-repeat">
<span style="position: absolute; left: 9px; top: 0; bottom: 0; width: 5px; background: #14233B"></span>
<span style="position: absolute; left: 2px; top: 110px; width: 20px; height: 12px; background: #F47A2A; box-shadow: inset 0 0 0 1.5px #14233B"></span>
</div>
<span style="font-size: 14px; font-weight: 700; line-height: 1">B</span>
</div>
</div>
<span aria-hidden="true" style="width: 1px; background: #14233B"></span>
<div style="width: 160px; display: flex; flex-direction: column; justify-content: space-between">
<div style="font-size: 27px; font-weight: 700; line-height: .95; letter-spacing: .01em; border-top: 3px solid #14233B; padding-top: 6px">Pocket<br>Instruments</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div class="fl" aria-hidden="true" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><span>sound</span><span>pattern</span><span>bpm</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<button class="f" aria-label="sound" style="background: #F47A2A"></button>
<button class="f" aria-label="pattern" style="background: #F2D83B"></button>
<button class="f" aria-label="bpm" style="background: #1F5FD0"></button>
</div>
<div class="fl" aria-hidden="true" style="grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 6px"><span>function</span><span>fx</span><span>play</span><span>write</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<button class="f" aria-label="function"></button>
<button class="f" aria-label="fx"></button>
<button class="f latch" aria-label="play, latched"></button>
<button class="f" aria-label="write"></button>
</div>
</div>
</div>
</div>

<div style="flex: 1; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 8px; border-top: 1px solid #14233B">
<div style="display: flex; gap: 16px">
<div class="j"><span>CLOCK</span><span class="jn"><span class="jh"></span></span></div>
<div class="j"><span>RESET</span><span class="jn"><span class="jh"></span></span></div>
</div>
<div class="j"><span>AUDIO</span><span class="jn" style="background: #F47A2A"><span class="jh"></span></span></div>
</div>
</div>
</body>
</html>

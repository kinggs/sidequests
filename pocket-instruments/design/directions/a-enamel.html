.k{height:45px;border-radius:11px;background:#AEBBEA;color:#1B2A6B;font-weight:700;font-size:15px}

.f.latch{background:#FFC93C;border-bottom:6px solid #101B4D}
.s{height:6px;border-radius:3px;background:#4A5AA6}

.jn{width:32px;height:32px;border-radius:50%;background:#D5DAEE;display:flex;align-items:center;justify-content:center}
.jh{width:14px;height:14px;border-radius:50%;background:#0B1030}

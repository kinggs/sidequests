<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B, Loom</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
body{margin:0}
button{border:0;padding:0;margin:0;font:inherit;cursor:pointer}
.k{height:46.5px;background:#2D2B45;color:#C9C2DD;font-weight:700;font-size:13px}
.k.on{background:#EADFC6;color:#1C1B2B}
.k.play{box-shadow:inset 0 0 0 4px #E7A92B;color:#FFFFFF}
.f{height:36px;background:#2D2B45}
.f.latch{background:#EADFC6;box-shadow:inset 0 0 0 4px #1C1B2B,inset 0 0 0 6px #EADFC6}
.fl{display:grid;gap:4px;font-size:7px;font-weight:700;text-align:center;color:#EADFC6}
.s{width:3px;height:6px;background:#6E6A92;justify-self:center}
.s.now{height:14px;background:#E7A92B}
.sc{position:absolute;width:14px;height:8px;border-radius:4px;background:#0E0D17}
.j{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:8px;font-weight:700;letter-spacing:.08em}
.jn{width:32px;height:32px;border-radius:50%;background:#EADFC6;display:flex;align-items:center;justify-content:center}
.jh{width:14px;height:14px;border-radius:50%;background:#0E0D17}
</style>
</head>
<body style="background: #07060C">
<div style="position: relative; width: 488px; height: 514px; box-sizing: border-box; padding: 28px 20px; background: #1C1B2B; color: #EADFC6; font-family: 'JetBrains Mono', ui-monospace, monospace; display: flex; flex-direction: column; gap: 24px">
<span class="sc" aria-hidden="true" style="left: 14px; top: 8px"></span>
<span class="sc" aria-hidden="true" style="right: 14px; top: 8px"></span>
<span class="sc" aria-hidden="true" style="left: 14px; bottom: 8px"></span>
<span class="sc" aria-hidden="true" style="right: 14px; bottom: 8px"></span>

<div style="height: 100px; box-sizing: border-box; background: #0E0D17; border: 2px solid #EADFC6; padding: 10px 14px; display: flex; gap: 14px; align-items: stretch">
<svg role="img" aria-label="A cloth being woven, row by row" viewBox="0 0 260 76" style="flex: 1; min-width: 0; height: 76px">
<defs><pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4M0 0V4" stroke="#0E0D17" stroke-width="1.3" fill="none"/></pattern></defs>
<rect x="0" y="0" width="184" height="76" fill="#2D2B45"/>
<g fill="#D9482F"><polygon points="32,6 60,38 32,70 4,38"/><polygon points="92,6 120,38 92,70 64,38"/><polygon points="152,6 180,38 152,70 124,38"/></g>
<g fill="#E7A92B"><polygon points="32,18 48,38 32,58 16,38"/><polygon points="92,18 108,38 92,58 76,38"/><polygon points="152,18 168,38 152,58 136,38"/></g>
<g fill="#EADFC6"><polygon points="32,30 40,38 32,46 24,38"/><polygon points="92,30 100,38 92,46 84,38"/><polygon points="152,30 160,38 152,46 144,38"/></g>
<rect x="0" y="0" width="184" height="76" fill="url(#weave)"/>
<g stroke="#6E6A92" stroke-width="1"><path d="M190 0V76M198 0V76M206 0V76M214 0V76M222 0V76M230 0V76M238 0V76M246 0V76M254 0V76"/></g>
<rect x="184" y="34" width="76" height="4" fill="#EADFC6"/>
<rect x="184" y="0" width="4" height="76" fill="#E7A92B"/>
</svg>
<div style="width: 104px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 34px; font-weight: 800; line-height: 1; color: #EADFC6">120</span>
<span style="font-size: 9px; font-weight: 700; color: #C9C2DD">bpm</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 700; color: #E7A92B">
<svg aria-hidden="true" viewBox="0 0 16 10" style="width: 16px; height: 10px"><path d="M1 9L11 3" stroke="#E7A92B" stroke-width="2" fill="none"/><circle cx="12.5" cy="2.5" r="1.8" fill="none" stroke="#E7A92B" stroke-width="1.4"/></svg>
<span>write</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); height: 14px; align-items: end">
<span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s now"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span><span class="s"></span>
</div>
</div>
</div>

<div style="height: 192px; display: flex; justify-content: space-between">
<div style="width: 192px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; align-content: space-between">
<button class="k on">1</button><button class="k">2</button><button class="k">3</button><button class="k">4</button>
<button class="k on">5</button><button class="k play">6</button><button class="k on">7</button><button class="k">8</button>
<button class="k on">9</button><button class="k">10</button><button class="k on">11</button><button class="k">12</button>
<button class="k on">13</button><button class="k">14</button><button class="k">15</button><button class="k">16</button>
</div>
<span aria-hidden="true" style="width: 0; border-left: 2px dashed #EADFC6"></span>
<div style="width: 48px; display: flex; justify-content: space-between">
<div style="width: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="position: relative; flex: 1; width: 2px; background: #EADFC6">
<span style="position: absolute; left: -10px; top: 40px; width: 22px; height: 10px; background: #D9482F"></span>
</div>
<span style="font-size: 11px; font-weight: 800">A</span>
</div>
<div style="width: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="position: relative; flex: 1; width: 2px; background: #EADFC6">
<span style="position: absolute; left: -10px; top: 118px; width: 22px; height: 10px; background: #E7A92B"></span>
</div>
<span style="font-size: 11px; font-weight: 800">B</span>
</div>
</div>
<span aria-hidden="true" style="width: 0; border-left: 2px dashed #EADFC6"></span>
<div style="width: 160px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<button class="f" aria-label="sound" style="background: #D9482F"></button>
<button class="f" aria-label="pattern" style="background: #E7A92B"></button>
<button class="f" aria-label="bpm" style="background: #7C9BF2"></button>
</div>
<div class="fl" aria-hidden="true" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><span>sound</span><span>pattern</span><span>bpm</span></div>
</div>
<span aria-hidden="true" style="height: 0; border-top: 2px dashed #6E6A92"></span>
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<button class="f" aria-label="function"></button>
<button class="f" aria-label="fx"></button>
<button class="f latch" aria-label="play, latched"></button>
<button class="f" aria-label="write"></button>
</div>
<div class="fl" aria-hidden="true" style="grid-template-columns: repeat(4, minmax(0, 1fr))"><span>function</span><span>fx</span><span>play</span><span>write</span></div>
</div>
</div>
</div>

<div style="flex: 1; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 8px">
<div style="display: flex; gap: 16px">
<div class="j"><span>CLOCK</span><span class="jn"><span class="jh"></span></span></div>
<div class="j"><span>RESET</span><span class="jn"><span class="jh"></span></span></div>
</div>
<span style="font-size: 13px; font-weight: 800; letter-spacing: .04em; padding-bottom: 9px">Pocket Instruments</span>
<div class="j" style="color: #E7A92B"><span>AUDIO</span><span class="jn" style="background: #E7A92B"><span class="jh"></span></span></div>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bloc 11</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  /* Bloc 11 on shared/theme.css. Orange is this app's accent and only marks its data: a send,
     the hardest-send line, the grade bars. Choosing a climber or a grade is neutral. */
  :root{ --accent:#F0983A; --accent-ink:#1A1006; }
  main{flex:1;min-height:0;padding:4px 16px 16px;overflow-y:auto;max-width:40rem;width:100%;margin:0 auto}
  .sect{color:var(--dim);margin:28px 0 10px}
  .sect:first-child{margin-top:4px}
  .hint{margin-top:8px}
  label{display:block;font-size:.8333rem;font-weight:600;color:var(--dim);margin:14px 0 6px}
  .userbtn{min-height:var(--tap);padding:0 16px;font-size:.8333rem}
  .gate p{color:var(--dim)}

  /* ---- grade grid ---- */
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .grades button{min-height:72px;padding:0;background:var(--ink-1);color:var(--text);border-radius:var(--r-card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
  .grades button>span{font-family:var(--grot);font-size:1.6667rem;font-weight:600}
  .grades button small{font-size:.8333rem;font-weight:600;margin-top:2px;color:inherit}
  .grades button[aria-pressed="true"]{background:var(--text);color:var(--ink-0)}

  .row{display:flex;gap:14px;margin-top:16px}
  .row button{flex:1}
  .row button.big{min-height:var(--tap-lg);font-size:1.0556rem}

  /* ---- progress ---- */
  .tiles{margin:12px 0}
  .tile em{font-style:normal}
  .chart .legend{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;font-size:.8333rem;color:var(--dim);padding:4px 0 6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
  .legend i.sent{background:var(--accent)}
  .legend i.proj{border:2px solid var(--dim)}
  .legend i.big{width:18px;height:18px;vertical-align:-4px}
  .session{margin:10px 8px 6px;font-size:.8889rem;color:var(--dim);min-height:1.4em}
  .session b{color:var(--text)}
  .session ul{list-style:none;margin-top:4px}
  .session li{padding:2px 0}
  .bars{margin-top:12px}
  .brow{display:flex;align-items:center;gap:10px;min-height:32px}
  .brow .g{width:3.2rem;text-align:right;font-family:var(--grot);font-weight:600;font-size:.9444rem}
  .brow .track{flex:1;height:14px;background:var(--ink-2);border-radius:7px;overflow:hidden}
  .brow .track i{display:block;height:100%;background:var(--accent);border-radius:7px 4px 4px 7px;transition:width .25s ease}
  .brow .n{width:2.6rem;font-size:.8889rem;color:var(--dim)}

  /* ---- recent: the grade, in orange when it was sent ---- */
  .rows .grade{flex:none;min-width:2.6rem;text-align:center;font-family:var(--grot);font-size:1.4444rem;font-weight:600;color:var(--accent)}
  .rows .grade.proj{color:var(--dim)}
  .rows .x{background:transparent;color:var(--dim);font-size:1.2222rem}
  .rows .x.arm{font-size:.8889rem;background:var(--warn);color:var(--ink-0)}
</style>
</head>
<body>

<header class="apphead">
  <h1>Bloc 11</h1>
  <div class="user" id="userBox"></div>
</header>

<main id="main">
  <section class="gate hidden" id="gate">
    <p id="gateMsg">Sign in to log your climbs.</p>
    <button class="primary" id="signInBig">Sign in with Google</button>
  </section>

  <section class="hidden" id="app">
    <h2 class="lbl sect">Log a climb</h2>
    <div class="chips" id="whoChips"></div>
    <div class="grades" id="grades"></div>
    <label for="note">Which route? (optional)</label>
    <input type="text" id="note" placeholder="the 5 in the cave" autocomplete="off">
    <label for="when">When</label>
    <input type="date" id="when">
    <div class="row">
      <button class="quiet big" id="projBtn">Projecting</button>
      <button class="primary big" id="sentBtn">Sent it</button>
    </div>

    <h2 class="lbl sect">Progress</h2>
    <div class="chips" id="progChips"></div>
    <div id="progress"></div>

    <h2 class="lbl sect">Recent</h2>
    <ul class="rows" id="recent"></ul>

    <h2 class="lbl sect">Climbers</h2>
    <ul class="rows" id="people"></ul>
    <div class="row">
      <button class="quiet" id="shareBtn">Share link</button>
      <button class="primary" id="addBtn">Add climber</button>
    </div>
    <p class="note hint">Climbers are shared by every sidequests app — add someone once and they're in all of them.</p>

    <div class="row">
      <button class="quiet" id="exportBtn">Export</button>
      <button class="quiet" id="importBtn">Import</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    <div id="installHere"></div>
  </section>
</main>

<footer class="foot">Bloc 11 <span id="version"></span></footer>

<script type="module">
  import { cloud } from "../shared/cloud.js";
  import { phone } from "../shared/phone.js";
  import { people } from "../shared/people.js";

  // Bump on every change. The deploy skill checks this against the live site.
  const APP_VERSION = "0.7.0";
  const APP_ID = "bloc-11";
  document.getElementById("version").textContent = "v" + APP_VERSION;

  const $ = id => document.getElementById(id);

  // ---- the grading system: 1–6, then chilli, then skull ----
  const GRADES = [
    { v:1, label:"1" }, { v:2, label:"2" }, { v:3, label:"3" }, { v:4, label:"4" },
    { v:5, label:"5" }, { v:6, label:"6" },
    { v:7, label:"🌶️", name:"Chilli" }, { v:8, label:"💀", name:"Skull" }
  ];
  const gradeOf = v => GRADES.find(g => g.v === v) || { v, label:String(v) };
  const gradeShort = v => gradeOf(v).label;
  const gradeWord = v => { const g = gradeOf(v); return `a ${g.name ? g.name.toLowerCase() : g.label}`; };

  // ---- state ----
  // Climbers are the household's shared people (shared/people.js): the same list, names and
  // colours in every app. This app only stores climbs, keyed by the person's id. You're a
  // climber by default — people.js links you by email, or asks which climber you are.
  let legacyClimbers = null;  // this app's own climber list from before people were shared; null until loaded
  let rawClimbs = [];         // as stored
  let climbs = [];            // { id, climber, grade, result, note, at, by }, climber resolved to a person
  let unsubs = [];
  let who = null;             // climber id selected in the log form
  let grade = null;           // grade selected in the log form
  let progWho = null;         // climber shown in Progress
  let openSession = null;     // day (epoch ms) expanded under the chart

  // The signed-in person comes first, then everyone else in the order they were added.
  const activeClimbers = () => people.active();
  const isMe = c => people.isMe(c.id);
  const nameOf = id => people.nameOf(id);
  const myClimberId = () => people.meId();
  // Old climbs may name an id that has since been merged or adopted; read them as the person.
  const refreshClimbs = () => { climbs = rawClimbs.map(c => ({ ...c, climber: people.resolve(c.climber) })); };

  // ---- taps: pointerup, not click ----
  function tap(node, fn){
    if (!node) return;
    let down = false, sx = 0, sy = 0;
    node.addEventListener("pointerdown", e => { down = true; sx = e.clientX; sy = e.clientY; });
    node.addEventListener("pointercancel", () => { down = false; });
    node.addEventListener("pointerup", e => {
      if (!down) return;
      down = false;
      if (Math.abs(e.clientX - sx) > 14 || Math.abs(e.clientY - sy) > 14) return; // a scroll, not a tap
      e.preventDefault();
      fn(e);
    });
    node.addEventListener("click", e => e.preventDefault());
  }
  function buzz(ms){ if (navigator.vibrate) navigator.vibrate(ms); }

  // ---- dates ----
  const DAY = 86400000;
  const startOfDay = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
  const daysSince = ms => Math.round((startOfDay(Date.now()) - startOfDay(ms)) / DAY);
  const pad = n => String(n).padStart(2, "0");
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  // Stored at 20:00 local so a day's climbs sort sensibly and sessions group by calendar day.
  function fromISO(iso){
    const [y,m,d] = iso.split("-").map(Number);
    return new Date(y, m-1, d, 20, 0, 0).getTime();
  }
  const shortDate = ms => new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short" });
  function whenLabel(ms){
    const n = daysSince(ms);
    if (n <= 0) return "Today";
    if (n === 1) return "Yesterday";
    if (n < 7) return new Date(ms).toLocaleDateString(undefined, { weekday:"long" });
    return new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
  }

  // ---- render ----
  function render(){
    renderWho();
    renderGrades();
    renderProgress();
    renderRecent();
    renderPeople();
  }

  function chipRow(wrap, selectedId, onPick){
    wrap.innerHTML = "";
    const list = activeClimbers();
    if (!list.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Add a climber below to get started.";
      wrap.appendChild(p);
      return;
    }
    for (const c of list){
      const b = document.createElement("button");
      b.type = "button";
      const nm = document.createElement("span");
      nm.textContent = isMe(c) ? `${c.name} (you)` : c.name;
      b.append(people.avatar(c.id, 40), nm);
      b.setAttribute("aria-pressed", c.id === selectedId ? "true" : "false");
      tap(b, () => onPick(c.id));
      wrap.appendChild(b);
    }
  }

  const isActive = id => !!id && activeClimbers().some(c => c.id === id);

  function renderWho(){
    const list = activeClimbers();
    if (!isActive(who)) who = myClimberId() || (list[0] && list[0].id) || null;
    chipRow($("whoChips"), who, id => { who = id; renderWho(); });
  }

  function renderGrades(){
    const wrap = $("grades");
    wrap.innerHTML = "";
    for (const g of GRADES){
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span></span>${g.name ? "<small></small>" : ""}`;
      b.querySelector("span").textContent = g.label;
      if (g.name) b.querySelector("small").textContent = g.name;
      b.setAttribute("aria-pressed", grade === g.v ? "true" : "false");
      b.setAttribute("aria-label", g.name || `Grade ${g.label}`);
      tap(b, () => { grade = grade === g.v ? null : g.v; renderGrades(); });
      wrap.appendChild(b);
    }
  }

  // ---- progress ----
  function renderProgress(){
    const list = activeClimbers();
    if (!isActive(progWho)) progWho = who || (list[0] && list[0].id) || null;
    chipRow($("progChips"), progWho, id => { progWho = id; openSession = null; renderProgress(); });
    const box = $("progress");
    box.innerHTML = "";
    if (!progWho) return;

    const mine = climbs.filter(c => c.climber === progWho).sort((a, b) => a.at - b.at);
    if (!mine.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = `Nothing logged for ${nameOf(progWho)} yet.`;
      box.appendChild(p);
      return;
    }
    const sends = mine.filter(c => c.result === "sent");
    const projects = mine.filter(c => c.result !== "sent");
    const hardest = sends.reduce((m, c) => Math.max(m, c.grade), 0);
    const working = projects.filter(c => c.grade > hardest).reduce((m, c) => Math.max(m, c.grade), 0);
    const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
    const thisMonth = sends.filter(c => c.at >= monthStart.getTime()).length;

    const tiles = document.createElement("div");
    tiles.className = "tiles";
    tiles.innerHTML = `
      <div class="tile"><b></b><span class="lbl">hardest<br>send</span></div>
      <div class="tile"><b></b><span class="lbl">working<br>on</span></div>
      <div class="tile"><b></b><span class="lbl">sends<br><em></em></span></div>`;
    const bs = tiles.querySelectorAll("b");
    bs[0].textContent = hardest ? gradeShort(hardest) : "—";
    bs[1].textContent = working ? gradeShort(working) : "—";
    bs[2].textContent = String(sends.length);
    tiles.querySelector("em").textContent = `${thisMonth} this month`;
    box.appendChild(tiles);

    box.appendChild(chart(mine));
    box.appendChild(gradeBars(sends));
  }

  // One bubble per (session, grade, outcome), grade on y, date on x, sized by how many
  // climbs it stands for (1 to BUBBLE_CAP); a line through each session's hardest send.
  const BUBBLE_CAP = 6;
  const bubbleR = n => 5 + (Math.min(n, BUBBLE_CAP) - 1) / (BUBBLE_CAP - 1) * 11;   // 5px .. 16px
  function chart(mine){
    const wrap = document.createElement("div");
    wrap.className = "chart";
    const W = Math.max(280, Math.min(640, ($("progress").clientWidth || 340) - 16));
    const H = 236, L = 44, R = 20, T = 20, B = 30;
    const iw = W - L - R, ih = H - T - B;

    const days = [...new Set(mine.map(c => startOfDay(c.at)))].sort((a, b) => a - b);
    let x0 = days[0], x1 = days[days.length - 1];
    if (x1 - x0 < 14 * DAY){ const mid = (x0 + x1) / 2; x0 = mid - 7 * DAY; x1 = mid + 7 * DAY; }
    { const pad = (x1 - x0) * 0.07; x0 -= pad; x1 += pad; }   // room for the biggest bubble at either end
    const X = t => L + (t - x0) / (x1 - x0) * iw;
    const Y = g => T + ih - (g - 1) / 7 * ih;

    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Climbs over time">`;
    // grid + y labels
    for (const g of GRADES){
      s += `<line x1="${L}" x2="${W - R}" y1="${Y(g.v)}" y2="${Y(g.v)}" stroke="var(--line)" stroke-width="1"/>`;
      s += `<text x="${L - 10}" y="${Y(g.v) + 5}" text-anchor="end" font-size="15" fill="var(--dim)">${g.label}</text>`;
    }
    // x ticks: first and last session, plus month starts in between
    const ticks = new Map();
    ticks.set(days[0], shortDate(days[0]));
    if (days.length > 1) ticks.set(days[days.length - 1], shortDate(days[days.length - 1]));
    const m = new Date(x0); m.setDate(1); m.setHours(0,0,0,0); m.setMonth(m.getMonth() + 1);
    while (m.getTime() < x1){
      const t = m.getTime();
      if (![...ticks.keys()].some(k => Math.abs(X(k) - X(t)) < 44)) ticks.set(t, m.toLocaleDateString(undefined, { month:"short" }));
      m.setMonth(m.getMonth() + 1);
    }
    for (const [t, label] of ticks){
      const x = X(t);
      const anchor = x < L + 20 ? "start" : x > W - R - 20 ? "end" : "middle";
      s += `<text x="${x}" y="${H - 8}" text-anchor="${anchor}" font-size="15" fill="var(--dim)">${label}</text>`;
    }
    // line through each session's hardest send
    const best = days.map(d => {
      const sent = mine.filter(c => startOfDay(c.at) === d && c.result === "sent");
      return sent.length ? { d, g: Math.max(...sent.map(c => c.grade)) } : null;
    }).filter(Boolean);
    if (best.length > 1){
      s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".7" points="${best.map(p => `${X(p.d)},${Y(p.g)}`).join(" ")}"/>`;
    }
    // bubbles, one per (day, grade, result), sized by count; projects hollow, sends filled.
    // Hollow rings go down first so a filled send at the same spot sits on top of them.
    const groups = new Map();
    for (const c of mine){
      const key = `${startOfDay(c.at)}|${c.grade}|${c.result === "sent" ? "sent" : "proj"}`;
      groups.set(key, (groups.get(key) || 0) + 1);
    }
    const bubbles = [...groups].map(([key, n]) => { const [d, g, r] = key.split("|"); return { d: Number(d), g: Number(g), proj: r === "proj", n }; })
      .sort((a, b) => (a.proj === b.proj ? b.n - a.n : a.proj ? -1 : 1));   // rings first, then sends, big before small
    for (const b of bubbles){
      const r = bubbleR(b.n);
      s += b.proj
        ? `<circle cx="${X(b.d)}" cy="${Y(b.g)}" r="${r}" fill="var(--ink-1)" fill-opacity=".6" stroke="var(--dim)" stroke-width="2"/>`
        : `<circle cx="${X(b.d)}" cy="${Y(b.g)}" r="${r}" fill="var(--accent)" fill-opacity=".85" stroke="var(--ink-1)" stroke-width="2"/>`;
    }
    // tap targets: one column per session
    for (const d of days){
      const x = X(d);
      s += `<rect class="hit" data-day="${d}" x="${x - 22}" y="${T - 6}" width="44" height="${ih + 12}" fill="transparent" ${openSession === d ? 'stroke="var(--line)" rx="8"' : ""}/>`;
    }
    s += `</svg>`;
    wrap.innerHTML = s + `<div class="legend"><span><i class="sent"></i>Sent</span><span><i class="proj"></i>Projecting</span><span><i class="sent big"></i>Bigger = more climbs</span></div><div class="session"></div>`;
    wrap.querySelectorAll(".hit").forEach(r => tap(r, () => {
      const d = Number(r.dataset.day);
      openSession = openSession === d ? null : d;
      renderProgress();
    }));

    const sess = wrap.querySelector(".session");
    if (openSession !== null && days.includes(openSession)){
      // Same grouping as the bubbles: "3× Sent a 3 · the cave one · slab"
      const rows = new Map();
      for (const c of mine.filter(c => startOfDay(c.at) === openSession)){
        const key = `${c.grade}|${c.result === "sent" ? "sent" : "proj"}`;
        const row = rows.get(key) || { grade: c.grade, sent: c.result === "sent", n: 0, notes: [] };
        row.n++; if (c.note) row.notes.push(c.note);
        rows.set(key, row);
      }
      const list = [...rows.values()].sort((a, b) => (b.grade - a.grade) || (b.sent - a.sent));
      sess.innerHTML = `<b></b><ul></ul>`;
      sess.querySelector("b").textContent = whenLabel(openSession);
      const ul = sess.querySelector("ul");
      for (const r of list){
        const li = document.createElement("li");
        li.textContent = `${r.n > 1 ? r.n + "× " : ""}${r.sent ? "Sent" : "Projecting"} ${gradeWord(r.grade)}${r.notes.length ? " · " + r.notes.join(" · ") : ""}`;
        ul.appendChild(li);
      }
    } else {
      sess.textContent = days.length > 1 ? "Tap a session to see what was climbed." : "";
    }
    return wrap;
  }

  function gradeBars(sends){
    const wrap = document.createElement("div");
    wrap.className = "bars";
    const counts = GRADES.map(g => ({ g, n: sends.filter(c => c.grade === g.v).length }));
    const max = Math.max(1, ...counts.map(c => c.n));
    const top = counts.reduce((m, c, i) => c.n ? i : m, -1);
    for (let i = 0; i <= top; i++){
      const { g, n } = counts[i];
      const row = document.createElement("div");
      row.className = "brow";
      row.innerHTML = `<span class="g"></span><span class="track"><i></i></span><span class="n"></span>`;
      row.querySelector(".g").textContent = g.label;
      row.querySelector(".track i").style.width = Math.round(n / max * 100) + "%";
      row.querySelector(".n").textContent = n ? `×${n}` : "";
      wrap.appendChild(row);
    }
    return wrap;
  }

  // ---- recent ----
  function renderRecent(){
    const ul = $("recent");
    ul.innerHTML = "";
    const rows = [...climbs].sort((a, b) => b.at - a.at).slice(0, 40);
    if (!rows.length){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing logged yet.";
      ul.appendChild(li);
      return;
    }
    for (const c of rows){
      const proj = c.result !== "sent";
      const li = document.createElement("li");
      li.innerHTML = `<span class="grade"></span>
        <span class="who"><div class="l1"></div><div class="l2"></div></span>
        <button type="button" class="x" aria-label="Delete">✕</button>`;
      const g = li.querySelector(".grade");
      g.textContent = gradeShort(c.grade);
      g.classList.toggle("proj", proj);
      li.querySelector(".l1").textContent = `${nameOf(c.climber)} · ${proj ? "projecting" : "sent"} ${gradeWord(c.grade)}`;
      li.querySelector(".l2").textContent = c.note ? `${whenLabel(c.at)} · ${c.note}` : whenLabel(c.at);
      armed(li.querySelector("button"), "✕", () => store.remove(c));
      ul.appendChild(li);
    }
  }

  // Two-tap delete: first tap arms it for five seconds, second tap does it.
  function armed(btn, label, fn){
    let timer = null;
    tap(btn, async () => {
      if (!timer){
        timer = setTimeout(() => { timer = null; btn.classList.remove("arm"); btn.textContent = label; }, 5000);
        btn.classList.add("arm");
        btn.textContent = "Sure?";
        buzz(12);
        return;
      }
      clearTimeout(timer); timer = null;
      btn.disabled = true; btn.textContent = "…";
      try { await fn(); }
      catch (e){ btn.disabled = false; btn.classList.remove("arm"); btn.textContent = label; toast("Couldn't do that: " + (e.message || e)); }
    });
  }

  // ---- climbers ----
  function renderPeople(){
    const ul = $("people");
    ul.innerHTML = "";
    const list = activeClimbers();
    if (!list.length){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No climbers yet. Add yourself first.";
      ul.appendChild(li);
      return;
    }
    // Edit opens the shared sheet: rename, colour, Gmail, merge a double entry, or remove.
    for (const c of list){
      const li = document.createElement("li");
      li.innerHTML = `<span class="who"><div class="l1"></div><div class="l2"></div></span><button type="button" class="quiet">Edit</button>`;
      li.prepend(people.avatar(c.id, 40));
      li.querySelector(".l1").textContent = isMe(c) ? `${c.name} (you)` : c.name;
      li.querySelector(".l2").textContent = c.email || "No Gmail";
      tap(li.querySelector("button"), () => people.edit(c.id, { noun: "climber" }));
      ul.appendChild(li);
    }
  }

  async function addClimber(){
    const id = await people.edit(null, { noun: "climber" });
    if (!id) return;
    if (!who) who = id;
    toast(`${nameOf(id)} added`);
    render();
  }

  function share(){
    const url = location.origin + location.pathname;
    if (navigator.share){
      navigator.share({ title:"Bloc 11", text:"Our climbing log — sign in with the Gmail that's been added.", url }).catch(() => {});
    } else if (navigator.clipboard){
      navigator.clipboard.writeText(url).then(() => toast("Link copied")).catch(() => {});
    }
  }

  // ---- logging ----
  async function logClimb(result){
    if (!who){ toast("Add a climber first."); return; }
    if (!grade){ toast("Pick a grade first."); buzz(20); return; }
    const entry = {
      climber: who,
      grade,
      result,
      note: $("note").value.trim(),
      at: fromISO($("when").value || toISO(new Date())),
      by: cloud.user ? cloud.user.email : null
    };
    const said = `${nameOf(who)} ${result === "sent" ? "sent" : "is projecting"} ${gradeWord(grade)}`;
    grade = null;
    $("note").value = "";
    renderGrades();
    buzz(result === "sent" ? [20, 40, 20] : 20);
    try { await store.add(entry); toast(result === "sent" ? `${said} 🎉` : said); }
    catch (e){ toast("Couldn't save: " + (e.message || e)); }
  }

  function toast(msg){
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  function download(name, text, type){
    const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }

  // ---- export / import ----
  function exportAll(){
    const data = { app: APP_ID, version: APP_VERSION, exportedAt: new Date().toISOString(), people: people.all(), climbs };
    download(`bloc-11-${toISO(new Date())}.json`, JSON.stringify(data, null, 2), "application/json");
  }

  async function importFile(file){
    let data;
    try { data = JSON.parse(await file.text()); }
    catch { return toast("That file isn't JSON."); }
    if (!data || !Array.isArray(data.climbs)) return toast("No climbs in that file.");
    // People first, so the climbs' ids resolve: `people` from this version's exports,
    // `climbers` from exports made before people were shared.
    const before = activeClimbers().length;
    people.adopt(data.people);
    people.adopt(data.climbers);
    const newPeople = Math.max(0, activeClimbers().length - before);
    const have = new Set(climbs.map(c => `${c.climber}|${c.grade}|${c.result}|${c.at}|${c.note || ""}`));
    let added = 0;
    for (const raw of data.climbs){
      if (!raw || !raw.climber || !raw.grade || !raw.at) continue;
      const entry = {
        climber: people.resolve(String(raw.climber)), grade: Number(raw.grade), result: raw.result === "sent" ? "sent" : "project",
        note: String(raw.note || ""), at: Number(raw.at), by: raw.by || null
      };
      const key = `${entry.climber}|${entry.grade}|${entry.result}|${entry.at}|${entry.note}`;
      if (have.has(key)) continue;
      have.add(key);
      await store.add(entry);
      added++;
    }
    toast(added || newPeople ? `Imported ${added} climb${added === 1 ? "" : "s"}, ${newPeople} new climber${newPeople === 1 ? "" : "s"}` : "Nothing new to import");
  }

  // ---- storage ----
  // Cloud when Firebase is set up and signed in; a plain in-memory copy otherwise, so the
  // app still runs (and still exports) if it's ever opened without the cloud.
  const store = {
    get live(){ return cloud.configured() && !!cloud.user; },
    async add(entry){
      if (this.live) return cloud.save(`climbs/${cloud.newId()}`, entry);
      rawClimbs = [...rawClimbs, { id: "local-" + Math.random().toString(36).slice(2), ...entry }];
      refreshClimbs();
      render();
    },
    async remove(c){
      if (this.live) return cloud.delete(`climbs/${c.id}`);
      rawClimbs = rawClimbs.filter(x => x.id !== c.id);
      refreshClimbs();
      render();
    }
  };

  // ---- wiring ----
  tap($("sentBtn"), () => logClimb("sent"));
  tap($("projBtn"), () => logClimb("project"));
  tap($("addBtn"), addClimber);
  tap($("shareBtn"), share);
  phone.mountInstall($("installHere"), { label: "Install on this phone" });
  tap($("exportBtn"), exportAll);
  tap($("importBtn"), () => $("importFile").click());
  $("importFile").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (f) importFile(f);
  });
  $("when").value = toISO(new Date());

  // A rename, a merge or someone new on another phone (or in another app) shows up here.
  people.onChange(() => { refreshClimbs(); render(); });

  // ---- cloud ----
  const userBox = $("userBox");
  await cloud.init(APP_ID);

  function applyUser(user){
    if (user) {
      userBox.innerHTML = `${user.photoURL ? `<img src="${user.photoURL}" alt="">` : ""}<button class="quiet userbtn" id="signOut">Sign out</button>`;
      tap($("signOut"), () => cloud.signOut());
    } else {
      userBox.innerHTML = "";
    }
    start(user);
  }

  // onUser only fires straight away when someone is signed in, so paint the signed-out
  // state ourselves. Also what makes the app run before Firebase is set up.
  cloud.onUser(applyUser);
  if (!cloud.user) applyUser(null);

  tap($("signInBig"), () => cloud.signIn().catch(err => {
    $("gateMsg").textContent = "Sign-in failed: " + (err && err.code ? err.code : err);
  }));

  // ---- app ----
  function start(user){
    unsubs.forEach(u => { try { u(); } catch {} });
    unsubs = [];
    who = null; progWho = null; legacyClimbers = null;

    const gated = cloud.configured() && !user;
    $("gate").classList.toggle("hidden", !gated);
    $("app").classList.toggle("hidden", gated);
    if (gated) return;

    if (cloud.configured()){
      unsubs.push(people.start({
        legacy: () => legacyClimbers,
        onMe: ({ name, added }) => {
          toast(added ? `Added you as ${name} — tap a name to log for someone else` : `You're ${name} — logging for you unless you tap someone else`);
          who = myClimberId();
          render();
        },
        onError: e => toast("Couldn't save to the cloud: " + (e.message || e))
      }));
      unsubs.push(cloud.watch("state/main", doc => {
        legacyClimbers = (doc && doc.climbers) || {};
        people.poke();
        render();
      }));
      unsubs.push(cloud.watchList("climbs", rows => {
        rawClimbs = rows.filter(r => typeof r.at === "number" && typeof r.grade === "number");
        refreshClimbs();
        render();
      }, { orderBy: "at", desc: true, limit: 1000 }));
    }
    render();
  }

  // ---- offline shell ----
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>

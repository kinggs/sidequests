<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bloc 11</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  /* Bloc 11 on shared/theme.css (dark system v3, shared/DESIGN.md). Amber is this app's accent and
     only marks its data: a send, the hardest-send line, the grade bars. Sky, the second, marks
     projecting. Choosing a climber or a grade is neutral. */
  :root{ --accent:var(--amber); --accent-ink:var(--amber-ink); --accent-soft:var(--amber-soft);
         --accent-2:var(--sky); --accent-2-ink:var(--sky-ink); --accent-2-soft:var(--sky-soft) }
  .hint{margin-top:8px}
  .grid{margin-top:12px}

  /* ---- progress: the chart's own bits ---- */
  .chart .legend{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;font-size:.8333rem;color:var(--dim);padding:4px 0 6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
  .legend i.sent{background:var(--accent)}
  .legend i.proj{border:2px solid var(--accent-2)}
  .legend i.lg{width:18px;height:18px;vertical-align:-4px}
  .session{margin:10px 8px 6px;font-size:.8889rem;color:var(--dim);min-height:1.4em}
  .session b{color:var(--text)}
  .session ul{list-style:none;margin-top:4px}
  .session li{padding:2px 0}
  .bars{margin-top:12px}
  .tile em{font-style:normal}
  /* The When line (frame 3a): one .note line, the whole of it a target; the date input stays
     hidden behind it and only lends its picker. Not display:none, so showPicker() can open it. */
  .when{min-height:60px;display:flex;align-items:center;margin-top:8px;cursor:pointer}
  .when b{color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .when-pick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<header class="apphead">
  <h1>Bloc 11</h1>
  <div class="me-host" id="meHost"></div>
</header>

<main class="page" id="main">
  <section class="gate hidden" id="gate">
    <p id="gateMsg">Sign in to log your climbs.</p>
    <button class="primary" id="signInBig">Sign in with Google</button>
  </section>

  <section class="hidden" id="app">
    <h2 class="lbl sect">Log a climb</h2>
    <div class="chips" id="whoChips"></div>
    <div class="row"><button class="quiet" id="guestBtn">Add a guest</button></div>
    <div class="grid" id="grades"></div>
    <label for="note">Which route? (optional)</label>
    <input type="text" id="note" placeholder="the 5 in the cave" autocomplete="off">
    <p class="note when" id="whenLine" role="button" tabindex="0"><span><b>Today</b>. Tap the date to change it.</span></p>
    <input type="date" id="when" class="when-pick" tabindex="-1" aria-label="When">
    <div class="row">
      <button class="quiet big" id="projBtn">Projecting</button>
      <button class="primary big" id="sentBtn">Sent it</button>
    </div>

    <h2 class="lbl sect">Progress</h2>
    <div class="chips" id="progChips"></div>
    <div id="progress"></div>

    <h2 class="lbl sect">Recent</h2>
    <ul class="rows" id="recent"></ul>

    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </section>
</main>

<footer class="foot">Bloc 11 <span id="version"></span></footer>

<script type="module">
  import { cloud } from "../shared/cloud.js";
  import { phone } from "../shared/phone.js";
  import { people } from "../shared/people.js";
  import { connect } from "../shared/connect.js";
  import { ui } from "../shared/ui.js";

  // Bump on every change. The deploy skill checks this against the live site.
  const APP_VERSION = "0.9.1";
  const APP_ID = "bloc-11";
  document.getElementById("version").textContent = "v" + APP_VERSION;

  const $ = id => document.getElementById(id);

  // ---- the grading system: 1–6, then chilli, then skull ----
  const GRADES = [
    { v:1, label:"1" }, { v:2, label:"2" }, { v:3, label:"3" }, { v:4, label:"4" },
    { v:5, label:"5" }, { v:6, label:"6" },
    { v:7, label:"🌶️", name:"Chilli" }, { v:8, label:"💀", name:"Skull" }
  ];
  const gradeOf = v => GRADES.find(g => g.v === v) || { v, label:String(v) };
  const gradeShort = v => gradeOf(v).label;
  const gradeWord = v => { const g = gradeOf(v); return `a ${g.name ? g.name.toLowerCase() : g.label}`; };

  // ---- state ----
  // Anyone signed in logs climbs (the open rule, KIT-PLAN Session 9): for themselves and for their
  // guests, people with no phone (shared/people.js). Each sees the climbs they're in, and the owner
  // sees every climb. A climb's players is its one climber.
  let rawClimbs = [];         // as stored
  let climbs = [];            // { id, climber, grade, result, note, at, by, uids }, climber resolved to a person
  let unsubs = [];
  let owner = false;          // the one admin: every climb
  let run = 0;                // which sign-in start() is on
  let accountSig = "";        // what the header's avatar last showed (mountAccount)
  let knownNames = {};        // id → the name a climb stored, for climbers this phone can't name
  let who = null;             // climber id selected in the log form
  let grade = null;           // grade selected in the log form
  let progWho = null;         // climber shown in Progress
  let openSession = null;     // day (epoch ms) expanded under the chart

  const myUid = () => (cloud.user && cloud.user.uid) || "";
  // Who you log for: you and your guests.
  const loggable = () => people.players().filter(p => !p.deleted && (p.id === people.meId() || p.kind === "guest"));
  const isMe = id => people.isMe(id);
  const nameOf = id => people.get(id) ? people.nameOf(id) : knownNames[id] || "Someone";
  // Old climbs may name an id that has since been merged, adopted or claimed; read them as the person.
  function refreshClimbs(){
    climbs = rawClimbs.map(c => ({ ...c, climber: people.resolve(c.climber) }));
    knownNames = {};
    for (const c of rawClimbs) if (Array.isArray(c.names) && c.names[0]) knownNames[people.resolve(c.climber)] = c.names[0];
  }
  // Progress shows whoever you can log for, and anyone else whose climbs you can see.
  function progressIds(){
    const ids = loggable().map(p => p.id);
    for (const c of [...climbs].sort((a, b) => b.at - a.at)) if (!ids.includes(c.climber)) ids.push(c.climber);
    return ids;
  }

  // Taps, holds, toasts and sheets: shared/ui.js.
  const tap = ui.tap, buzz = ui.buzz, toast = ui.toast;
  // A row's ⋯: the note for anyone in the climb, delete behind a hold for whoever logged it or the owner.
  const mayEdit = c => owner || !Array.isArray(c.uids) || c.uids.includes(myUid());
  const mayDelete = c => owner || !c.by || c.by === myUid();

  // ---- dates ----
  const DAY = 86400000;
  const startOfDay = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
  const daysSince = ms => Math.round((startOfDay(Date.now()) - startOfDay(ms)) / DAY);
  const pad = n => String(n).padStart(2, "0");
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  // Stored at 20:00 local so a day's climbs sort sensibly and sessions group by calendar day.
  function fromISO(iso){
    const [y,m,d] = iso.split("-").map(Number);
    return new Date(y, m-1, d, 20, 0, 0).getTime();
  }
  const shortDate = ms => new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short" });
  function whenLabel(ms){
    const n = daysSince(ms);
    if (n <= 0) return "Today";
    if (n === 1) return "Yesterday";
    if (n < 7) return new Date(ms).toLocaleDateString(undefined, { weekday:"long" });
    return new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
  }

  // ---- render ----
  function render(){
    renderWho();
    renderGrades();
    renderProgress();
    renderRecent();
  }

  function chipRow(wrap, ids, selectedId, onPick, empty){
    wrap.innerHTML = "";
    if (!ids.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = empty;
      wrap.appendChild(p);
      return;
    }
    for (const id of ids){
      const b = document.createElement("button");
      b.type = "button";
      const nm = document.createElement("span");
      nm.textContent = isMe(id) ? `${nameOf(id)} (you)` : nameOf(id);
      b.append(people.avatar(id, 40), nm);
      b.setAttribute("aria-pressed", id === selectedId ? "true" : "false");
      tap(b, () => onPick(id));
      wrap.appendChild(b);
    }
  }

  function renderWho(){
    const ids = loggable().map(p => p.id);
    if (!ids.includes(who)) who = people.meId() || ids[0] || null;
    chipRow($("whoChips"), ids, who, id => { who = id; renderWho(); }, "Signing you in…");
  }

  function renderGrades(){
    const wrap = $("grades");
    wrap.innerHTML = "";
    for (const g of GRADES){
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<span></span>${g.name ? "<small></small>" : ""}`;
      b.querySelector("span").textContent = g.label;
      if (g.name) b.querySelector("small").textContent = g.name;
      b.setAttribute("aria-pressed", grade === g.v ? "true" : "false");
      b.setAttribute("aria-label", g.name || `Grade ${g.label}`);
      tap(b, () => { grade = grade === g.v ? null : g.v; renderGrades(); });
      wrap.appendChild(b);
    }
  }

  // ---- progress ----
  function renderProgress(){
    const ids = progressIds();
    if (!ids.includes(progWho)) progWho = (ids.includes(who) && who) || ids[0] || null;
    chipRow($("progChips"), ids, progWho, id => { progWho = id; openSession = null; renderProgress(); }, "");
    const box = $("progress");
    box.innerHTML = "";
    if (!progWho) return;

    const mine = climbs.filter(c => c.climber === progWho).sort((a, b) => a.at - b.at);
    if (!mine.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = `Nothing logged for ${nameOf(progWho)} yet.`;
      box.appendChild(p);
      return;
    }
    const sends = mine.filter(c => c.result === "sent");
    const projects = mine.filter(c => c.result !== "sent");
    const hardest = sends.reduce((m, c) => Math.max(m, c.grade), 0);
    const working = projects.filter(c => c.grade > hardest).reduce((m, c) => Math.max(m, c.grade), 0);
    const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
    const thisMonth = sends.filter(c => c.at >= monthStart.getTime()).length;

    const tiles = document.createElement("div");
    tiles.className = "tiles";
    tiles.innerHTML = `
      <div class="tile on"><b></b><span class="lbl">hardest<br>send</span></div>
      <div class="tile"><b></b><span class="lbl">working<br>on</span></div>
      <div class="tile"><b></b><span class="lbl">sends<br><em></em></span></div>`;
    const bs = tiles.querySelectorAll("b");
    bs[0].textContent = hardest ? gradeShort(hardest) : "—";
    bs[1].textContent = working ? gradeShort(working) : "—";
    bs[2].textContent = String(sends.length);
    tiles.querySelector("em").textContent = `${thisMonth} this month`;
    box.appendChild(tiles);

    box.appendChild(chart(mine));
    box.appendChild(gradeBars(sends));
  }

  // One bubble per (session, grade, outcome), grade on y, date on x, sized by how many
  // climbs it stands for (1 to BUBBLE_CAP); a line through each session's hardest send.
  const BUBBLE_CAP = 6;
  const bubbleR = n => 5 + (Math.min(n, BUBBLE_CAP) - 1) / (BUBBLE_CAP - 1) * 11;   // 5px .. 16px
  function chart(mine){
    const wrap = document.createElement("div");
    wrap.className = "chart";
    const W = Math.max(280, Math.min(640, ($("progress").clientWidth || 340) - 16));
    const H = 236, L = 44, R = 20, T = 20, B = 30;
    const iw = W - L - R, ih = H - T - B;

    const days = [...new Set(mine.map(c => startOfDay(c.at)))].sort((a, b) => a - b);
    let x0 = days[0], x1 = days[days.length - 1];
    if (x1 - x0 < 14 * DAY){ const mid = (x0 + x1) / 2; x0 = mid - 7 * DAY; x1 = mid + 7 * DAY; }
    { const pad = (x1 - x0) * 0.07; x0 -= pad; x1 += pad; }   // room for the biggest bubble at either end
    const X = t => L + (t - x0) / (x1 - x0) * iw;
    const Y = g => T + ih - (g - 1) / 7 * ih;

    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Climbs over time">`;
    // grid + y labels
    for (const g of GRADES){
      s += `<line x1="${L}" x2="${W - R}" y1="${Y(g.v)}" y2="${Y(g.v)}" stroke="var(--line)" stroke-width="1"/>`;
      s += `<text x="${L - 10}" y="${Y(g.v) + 5}" text-anchor="end" font-size="15" fill="var(--dim)">${g.label}</text>`;
    }
    // x ticks: first and last session, plus month starts in between
    const ticks = new Map();
    ticks.set(days[0], shortDate(days[0]));
    // The last session too, unless it would sit on top of the first.
    if (days.length > 1 && X(days[days.length - 1]) - X(days[0]) >= 64) ticks.set(days[days.length - 1], shortDate(days[days.length - 1]));
    const m = new Date(x0); m.setDate(1); m.setHours(0,0,0,0); m.setMonth(m.getMonth() + 1);
    while (m.getTime() < x1){
      const t = m.getTime();
      if (![...ticks.keys()].some(k => Math.abs(X(k) - X(t)) < 44)) ticks.set(t, m.toLocaleDateString(undefined, { month:"short" }));
      m.setMonth(m.getMonth() + 1);
    }
    for (const [t, label] of ticks){
      const x = X(t);
      const anchor = x < L + 20 ? "start" : x > W - R - 20 ? "end" : "middle";
      s += `<text x="${x}" y="${H - 8}" text-anchor="${anchor}" font-size="15" fill="var(--dim)">${label}</text>`;
    }
    // line through each session's hardest send
    const best = days.map(d => {
      const sent = mine.filter(c => startOfDay(c.at) === d && c.result === "sent");
      return sent.length ? { d, g: Math.max(...sent.map(c => c.grade)) } : null;
    }).filter(Boolean);
    if (best.length > 1){
      s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".7" points="${best.map(p => `${X(p.d)},${Y(p.g)}`).join(" ")}"/>`;
    }
    // bubbles, one per (day, grade, result), sized by count; projects hollow in sky, sends filled amber.
    // Hollow rings go down first so a filled send at the same spot sits on top of them.
    const groups = new Map();
    for (const c of mine){
      const key = `${startOfDay(c.at)}|${c.grade}|${c.result === "sent" ? "sent" : "proj"}`;
      groups.set(key, (groups.get(key) || 0) + 1);
    }
    const bubbles = [...groups].map(([key, n]) => { const [d, g, r] = key.split("|"); return { d: Number(d), g: Number(g), proj: r === "proj", n }; })
      .sort((a, b) => (a.proj === b.proj ? b.n - a.n : a.proj ? -1 : 1));   // rings first, then sends, big before small
    for (const b of bubbles){
      const r = bubbleR(b.n);
      s += b.proj
        ? `<circle cx="${X(b.d)}" cy="${Y(b.g)}" r="${r}" fill="var(--ink-1)" fill-opacity=".6" stroke="var(--accent-2)" stroke-width="2"/>`
        : `<circle cx="${X(b.d)}" cy="${Y(b.g)}" r="${r}" fill="var(--accent)" fill-opacity=".85" stroke="var(--ink-1)" stroke-width="2"/>`;
    }
    // tap targets: one column per session
    for (const d of days){
      const x = X(d);
      s += `<rect class="hit" data-day="${d}" x="${x - 22}" y="${T - 6}" width="44" height="${ih + 12}" fill="transparent" ${openSession === d ? 'stroke="var(--line)" rx="8"' : ""}/>`;
    }
    s += `</svg>`;
    wrap.innerHTML = s + `<div class="legend"><span><i class="sent"></i>Sent</span><span><i class="proj"></i>Projecting</span><span><i class="sent lg"></i>Bigger = more climbs</span></div><div class="session"></div>`;
    wrap.querySelectorAll(".hit").forEach(r => tap(r, () => {
      const d = Number(r.dataset.day);
      openSession = openSession === d ? null : d;
      renderProgress();
    }));

    const sess = wrap.querySelector(".session");
    if (openSession !== null && days.includes(openSession)){
      // Same grouping as the bubbles: "3× Sent a 3 · the cave one · slab"
      const rows = new Map();
      for (const c of mine.filter(c => startOfDay(c.at) === openSession)){
        const key = `${c.grade}|${c.result === "sent" ? "sent" : "proj"}`;
        const row = rows.get(key) || { grade: c.grade, sent: c.result === "sent", n: 0, notes: [] };
        row.n++; if (c.note) row.notes.push(c.note);
        rows.set(key, row);
      }
      const list = [...rows.values()].sort((a, b) => (b.grade - a.grade) || (b.sent - a.sent));
      sess.innerHTML = `<b></b><ul></ul>`;
      sess.querySelector("b").textContent = whenLabel(openSession);
      const ul = sess.querySelector("ul");
      for (const r of list){
        const li = document.createElement("li");
        li.textContent = `${r.n > 1 ? r.n + "× " : ""}${r.sent ? "Sent" : "Projecting"} ${gradeWord(r.grade)}${r.notes.length ? " · " + r.notes.join(" · ") : ""}`;
        ul.appendChild(li);
      }
    } else {
      sess.textContent = days.length > 1 ? "Tap a session to see what was climbed." : "";
    }
    return wrap;
  }

  function gradeBars(sends){
    const wrap = document.createElement("div");
    wrap.className = "bars";
    const counts = GRADES.map(g => ({ g, n: sends.filter(c => c.grade === g.v).length }));
    const max = Math.max(1, ...counts.map(c => c.n));
    const top = counts.reduce((m, c, i) => c.n ? i : m, -1);
    for (let i = 0; i <= top; i++){
      const { g, n } = counts[i];
      const row = document.createElement("div");
      row.className = "brow";
      row.innerHTML = `<span class="g"></span><span class="track"><i></i></span><span class="n"></span>`;
      row.querySelector(".g").textContent = g.label;
      row.querySelector(".track i").style.width = Math.round(n / max * 100) + "%";
      row.querySelector(".n").textContent = n ? `×${n}` : "";
      wrap.appendChild(row);
    }
    return wrap;
  }

  // ---- recent ----
  function renderRecent(){
    const ul = $("recent");
    ul.innerHTML = "";
    const rows = [...climbs].sort((a, b) => b.at - a.at).slice(0, 40);
    if (!rows.length){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Nothing logged yet.";
      ul.appendChild(li);
      return;
    }
    for (const c of rows){
      const proj = c.result !== "sent";
      const li = document.createElement("li");
      li.innerHTML = `<span class="fig"></span>
        <span class="who"><div class="l1"></div><div class="l2"></div></span>
        <button type="button" class="more" aria-label="More">⋯</button>`;
      const g = li.querySelector(".fig");
      g.textContent = gradeShort(c.grade);
      g.classList.toggle("alt", proj);
      const l1 = `${nameOf(c.climber)} · ${proj ? "projecting" : "sent"} ${gradeWord(c.grade)}`;
      li.querySelector(".l1").textContent = l1;
      li.querySelector(".l2").textContent = c.note ? `${whenLabel(c.at)} · ${c.note}` : whenLabel(c.at);
      const items = [
        ...(mayEdit(c) ? [{ label: c.note ? "Edit note" : "Add a note", value: "note", run: () => editNote(c) }] : []),
        ...(mayDelete(c) ? [{ label: "Delete", value: "del", hold: true,
          run: () => store.remove(c).then(() => toast("Deleted")).catch(e => toast("Couldn't delete: " + (e.message || e))) }] : []),
      ];
      if (items.length) ui.menu(li.querySelector(".more"), { title: l1, text: whenLabel(c.at), items });
      else li.querySelector(".more").remove();
      ul.appendChild(li);
    }
  }

  // Which route it was, after the fact.
  async function editNote(c){
    let input;
    const v = await ui.sheet({ title: "Which route?", items: [{ label: "Save", value: "save", primary: true }], body: () => {
      input = document.createElement("input");
      input.type = "text"; input.value = c.note || ""; input.placeholder = "the 5 in the cave"; input.autocomplete = "off";
      setTimeout(() => input.focus(), 50);
      return input;
    } });
    if (v !== "save") return;
    const note = input.value.trim();
    if (note === (c.note || "")) return;
    try { await store.patch(c, { note }); }
    catch (e){ toast("Couldn't save: " + (e.message || e)); }
  }

  // ---- logging ----
  // A climb names its one climber: players, names, and uids (their account, or else yours, since a
  // guest has none and the climb must stay yours to see), and by, whoever logged it.
  function climbFor(id, fields){
    const me = myUid();
    const uids = people.uidsOf([id]);
    return { climber: id, ...fields, players: [id], names: people.names([id]), uids: uids.length ? uids : me ? [me] : [], by: me || null };
  }
  async function logClimb(result){
    if (!who){ toast("Signing you in…"); return; }
    if (!grade){ toast("Pick a grade first."); buzz(20); return; }
    const entry = climbFor(who, { grade, result, note: $("note").value.trim(), at: fromISO($("when").value || toISO(new Date())) });
    const said = `${nameOf(who)} ${result === "sent" ? "sent" : "is projecting"} ${gradeWord(grade)}`;
    grade = null;
    $("note").value = "";
    renderGrades();
    buzz(result === "sent" ? [20, 40, 20] : 20);
    try { await store.add(entry); toast(result === "sent" ? `${said} 🎉` : said); }
    catch (e){ toast("Couldn't save: " + (e.message || e)); }
  }

  function download(name, text, type){
    const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }

  // ---- export / import ----
  // Export is everyone's: the climbs this phone can see. Import is the owner's.
  function exportAll(){
    const data = { app: APP_ID, version: APP_VERSION, exportedAt: new Date().toISOString(), people: owner ? people.all() : {}, climbs };
    download(`bloc-11-${toISO(new Date())}.json`, JSON.stringify(data, null, 2), "application/json");
  }

  async function importFile(file){
    let data;
    try { data = JSON.parse(await file.text()); }
    catch { return toast("That file isn't JSON."); }
    if (!data || !Array.isArray(data.climbs)) return toast("No climbs in that file.");
    // People first, so the climbs' ids resolve: `people` from this version's exports,
    // `climbers` from exports made before people were shared.
    const before = people.active().length;
    people.adopt(data.people);
    people.adopt(data.climbers);
    const newPeople = Math.max(0, people.active().length - before);
    const have = new Set(climbs.map(c => `${c.climber}|${c.grade}|${c.result}|${c.at}|${c.note || ""}`));
    let added = 0;
    for (const raw of data.climbs){
      if (!raw || !raw.climber || !raw.grade || !raw.at) continue;
      const id = people.resolve(String(raw.climber));
      const entry = { ...climbFor(id, { grade: Number(raw.grade), result: raw.result === "sent" ? "sent" : "project",
        note: String(raw.note || ""), at: Number(raw.at) }), ...(raw.by && !String(raw.by).includes("@") ? { by: String(raw.by) } : {}) };
      const key = `${entry.climber}|${entry.grade}|${entry.result}|${entry.at}|${entry.note}`;
      if (have.has(key)) continue;
      have.add(key);
      await store.add(entry);
      added++;
    }
    toast(added || newPeople ? `Imported ${added} climb${added === 1 ? "" : "s"}, ${newPeople} new climber${newPeople === 1 ? "" : "s"}` : "Nothing new to import");
  }

  // ---- storage ----
  // Cloud when Firebase is set up and signed in; a plain in-memory copy otherwise, so the
  // app still runs (and still exports) if it's ever opened without the cloud.
  const store = {
    get live(){ return cloud.configured() && !!cloud.user; },
    async add(entry){
      if (this.live) return cloud.save(`climbs/${cloud.newId()}`, entry);
      rawClimbs = [...rawClimbs, { id: "local-" + Math.random().toString(36).slice(2), ...entry }];
      refreshClimbs();
      render();
    },
    async patch(c, fields){
      if (this.live) return cloud.patch(`climbs/${c.id}`, fields);
      rawClimbs = rawClimbs.map(x => x.id === c.id ? { ...x, ...fields } : x);
      refreshClimbs();
      render();
    },
    async remove(c){
      if (this.live) return cloud.delete(`climbs/${c.id}`);
      rawClimbs = rawClimbs.filter(x => x.id !== c.id);
      refreshClimbs();
      render();
    }
  };

  // ---- wiring ----
  tap($("sentBtn"), () => logClimb("sent"));
  tap($("projBtn"), () => logClimb("project"));
  // A guest: someone with no phone, a name only you see. You log for them; they can claim it later.
  tap($("guestBtn"), async () => {
    const id = await people.addGuest();
    if (!id) return;
    who = id;
    render();
  });
  $("importFile").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (f) importFile(f);
  });
  // The When line reads the date and opens the picker; what's stored is unchanged (20:00 local).
  function paintWhen(){
    const iso = $("when").value || toISO(new Date());
    const today = iso === toISO(new Date());
    const day = new Date(fromISO(iso)).toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" }).replace(/,/g, "");
    $("whenLine").innerHTML = `<span>${today ? "<b>Today</b>. Tap the date to change it." : `<b>${day}</b>. Tap to change it.`}</span>`;
  }
  tap($("whenLine"), () => {
    const el = $("when");
    try { if (el.showPicker) return el.showPicker(); } catch {}
    el.focus(); el.click();
  });
  $("when").addEventListener("change", paintWhen);
  $("when").value = toISO(new Date());
  paintWhen();

  // A rename, a merge or someone new on another phone (or in another app) shows up here.
  people.onChange(() => { refreshClimbs(); render(); });

  // ---- cloud ----
  await cloud.init(APP_ID);
  connect.handleInvite({ app: APP_ID, appName: "Bloc 11" });   // a scanned QR: connect first

  // Your avatar in the header, and its sheet: Profile, My QR, Friends, Your guests, Export, Import
  // (the owner's), Install on this phone, Sign out.
  function mountAccount(){
    const user = cloud.user, me = user ? people.meId() : null, p = me ? people.get(me) : null;
    const installed = phone.installed();
    const sig = JSON.stringify([user && user.uid, me, p && [p.name, p.photo, people.colourOf(me)], owner, installed, people.guests().length]);
    if (sig === accountSig) return;
    accountSig = sig;
    const extra = !user ? [] : [
      { label: "Profile", value: "profile", run: () => connect.showProfile() },
      { label: "My QR", value: "qr", run: () => connect.showQR({ app: APP_ID }) },
      { label: "Friends", value: "friends", run: () => connect.showFriends() },
      ...(people.guests().length ? [{ label: "Your guests", value: "guests", run: () => people.showGuests({ app: APP_ID, rewrite: claimRewrite }) }] : []),
      { label: "Export", value: "export", run: exportAll },
      ...(owner ? [{ label: "Import", value: "import", run: () => $("importFile").click() }] : []),
      ...(installed ? [] : [{ label: "Install on this phone", value: "install", run: async () => {
        const how = await phone.install();
        if (how) ui.sheet({ title: "Install", text: how });
      } }]),
    ];
    ui.account($("meHost"), user, { onSignIn: () => cloud.signIn().catch(e => toast("Sign-in failed: " + (e.code || e.message || e))),
      onSignOut: () => cloud.signOut(), extra, name: p ? p.name : "", avatar: me ? people.avatar(me, 48) : null });
  }
  people.onChange(mountAccount);

  // That was them (KIT-PLAN.md Session 8): each climb you logged for that guest becomes the friend's.
  // The guest's id is swapped for theirs (climber, players), uids gains them, and names stays: the
  // rules' seatSwap. One rewrite a guest at a time: the claim and healClaims below can both start one.
  const claiming = new Map();
  function claimRewrite(gid, uid){
    if (!claiming.has(gid)) claiming.set(gid, rewriteClaim(gid, uid).finally(() => claiming.delete(gid)));
    return claiming.get(gid);
  }
  async function rewriteClaim(gid, uid){
    const me = myUid();
    const ops = rawClimbs.filter(x => x.by === me && Array.isArray(x.players) && x.players.includes(gid) && !(x.uids || []).includes(uid))
      .map(({ id, _updatedAt, names, uids, by, ...rest }) => {
        const swapped = people.swapId(rest, gid, uid), data = {};
        for (const [k, v] of Object.entries(swapped)) if (JSON.stringify(v) !== JSON.stringify(rest[k])) data[k] = v;
        data.uids = [...(uids || []), uid];
        return { patch: `climbs/${id}`, data };
      });
    for (let i = 0; i < ops.length; i += 400) await cloud.batch(ops.slice(i, i + 400));
    console.info("[claim]", gid, "→", uid, "in", ops.length, "climbs");
  }
  // A guest claimed in another app, or on another phone: your climbs with them follow, once.
  let healing = false;
  const healed = new Set();
  async function healClaims(){
    const me = myUid();
    if (healing || !me) return;
    const todo = people.claimedGuests().filter(g => !healed.has(g.id)
      && rawClimbs.some(x => x.by === me && Array.isArray(x.players) && x.players.includes(g.id)));
    if (!todo.length) return;
    healing = true;
    try { for (const g of todo){ healed.add(g.id); await claimRewrite(g.id, g.claimedBy); } }
    catch (e){ console.warn("[claim]", e); }
    finally { healing = false; }
  }
  people.onChange(healClaims);

  // onUser only fires straight away when someone is signed in, so paint the signed-out
  // state ourselves. Also what makes the app run before Firebase is set up.
  cloud.onUser(start);
  if (!cloud.user) start(null);

  tap($("signInBig"), () => cloud.signIn().catch(err => {
    $("gateMsg").textContent = "Sign-in failed: " + (err && err.code ? err.code : err);
  }));

  // ---- app ----
  // The owner sees every climb. Everyone logs for themselves and their guests and, the owner aside,
  // sees only the climbs they're in. A role that can't be read means a player: what the rules allow
  // anyone.
  async function start(user){
    unsubs.forEach(u => { try { u(); } catch {} });
    unsubs = [];
    const mine = ++run;
    owner = false;
    mountAccount();
    who = null; progWho = null; rawClimbs = []; climbs = [];

    const gated = cloud.configured() && !user;
    $("gate").classList.toggle("hidden", !gated);
    $("app").classList.toggle("hidden", gated);
    if (gated) return;

    if (cloud.configured()){
      let role = null;
      try { role = await cloud.role(); } catch (e){ console.warn("[role]", e); }
      if (mine !== run) return;
      owner = role === "owner";
      mountAccount();
      unsubs.push(people.start({
        onMe: ({ name, added }) => {
          toast(added ? `Added you as ${name}` : `You're ${name}`);
          who = people.meId();
          render();
        },
        onError: e => toast("Couldn't save to the cloud: " + (e.message || e))
      }));
      const opts = owner ? { orderBy: "at", desc: true, limit: 1000 } : { where: ["uids", "array-contains", user.uid] };
      unsubs.push(cloud.watchList("climbs", rows => {
        rawClimbs = rows.filter(r => typeof r.at === "number" && typeof r.grade === "number");
        refreshClimbs();
        healClaims();
        render();
      }, opts, e => toast("Couldn't load your climbs: " + (e.code || e.message || e))));
    }
    render();
  }

  // ---- offline shell ----
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Around the Clock</title>
<style>
  :root{
    --bg:#101418; --panel:#1a2027; --panel-lift:#232b34;
    --ink:#eef0f2; --ink-dim:#aab3bd; --accent:#3ec96f; --accent-ink:#06170c;
    --grid:rgba(255,255,255,.10); --danger:#e2603f;
    --miss:#2b333c; --single:#2f6f9e; --double:#c98a2c; --treble:#3ec96f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:18px;line-height:1.4;font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none;user-select:none;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--panel);flex:none}
  header h1{font-size:20px;font-weight:700}
  main{flex:1;min-height:0;padding:16px;overflow-y:auto;max-width:40rem;width:100%;margin:0 auto}
  body.playing main{overflow:hidden;padding:10px 12px;display:flex;flex-direction:column}
  footer{padding:8px 16px;font-size:15px;color:var(--ink-dim);text-align:center;flex:none}
  body.playing footer{display:none}
  .hidden{display:none !important}

  button{
    min-height:56px;padding:0 20px;border-radius:12px;border:none;
    background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;
  }
  button:active{filter:brightness(1.15)}
  button.quiet{background:transparent;color:var(--ink-dim);border:1px solid rgba(255,255,255,.22)}
  button.lift{background:var(--panel-lift);color:var(--ink)}
  button:disabled{opacity:.45}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .user{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-dim)}
  .user img{width:32px;height:32px;border-radius:50%}

  input[type=text],input[type=email]{
    width:100%;min-height:56px;padding:0 14px;font:inherit;font-size:18px;
    background:var(--panel);color:var(--ink);border:1px solid rgba(255,255,255,.14);border-radius:12px;
    -webkit-user-select:text;user-select:text;
  }
  label{display:block;font-size:15px;color:var(--ink-dim);margin:14px 0 6px}

  .gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px 8px}
  .gate p{color:var(--ink-dim)}
  .gate button{width:100%;max-width:20rem;height:64px;font-size:19px}

  h2.sect{font-size:16px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;
    letter-spacing:.06em;margin:28px 0 10px}
  h2.sect:first-child{margin-top:4px}
  .empty{color:var(--ink-dim);font-size:16px;padding:6px 2px}
  .hint{color:var(--ink-dim);font-size:15px;margin-top:8px}

  /* ---- chips (players) ---- */
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chips button{flex:1 1 auto;min-width:5rem;background:var(--panel);color:var(--ink-dim);border:1px solid rgba(255,255,255,.14)}
  .chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

  .row{display:flex;gap:10px;margin-top:12px}
  .row button{flex:1}
  .row button.big{min-height:68px;font-size:20px}
  .seg{display:flex;gap:0;margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
  .seg button{flex:1;border-radius:0;background:var(--panel);color:var(--ink-dim);font-size:18px}
  .seg button[aria-pressed="true"]{background:var(--panel-lift);color:var(--ink)}
  .resume{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
  .resume .t{flex:1}
  .resume .t small{display:block;color:var(--ink-dim);font-size:15px}

  /* ---- progress ---- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .tile{background:var(--panel);border-radius:14px;padding:12px 10px;text-align:center}
  .tile b{display:block;font-size:30px;font-weight:800;line-height:1.1}
  .tile span{display:block;font-size:15px;line-height:1.25;color:var(--ink-dim);margin-top:6px}
  .chart{background:var(--panel);border-radius:16px;padding:12px 8px 6px}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .cap{font-size:15px;color:var(--ink-dim);text-align:center;padding:6px 0 4px}

  /* ---- lists ---- */
  .list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .list li{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:10px 8px 10px 14px}
  .list .score{font-size:26px;font-weight:800;min-width:3rem;text-align:center}
  .list .score.live{color:var(--accent);font-size:17px}
  .list .who{flex:1;min-width:0}
  .list .who .l1{font-weight:600}
  .list .who .l2{font-size:15px;color:var(--ink-dim)}
  .list button{min-width:60px;min-height:56px;padding:0 6px;background:transparent;color:var(--ink-dim);font-size:15px}
  .list button.x:not(.arm){font-size:22px}
  .list button.arm{background:var(--danger);color:#fff}
  .list button.go{border:1px solid rgba(255,255,255,.22);min-width:90px;font-size:16px}
  .people button{min-width:90px;border:1px solid rgba(255,255,255,.22);font-size:16px}
  .people .you{font-size:15px;color:var(--ink-dim);padding-right:8px}
  .addbox{background:var(--panel);border-radius:16px;padding:6px 14px 16px;margin-top:12px}
  .addbox input{background:var(--bg)}

  /* ---- the game screen ---- */
  .game{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--panel);border-radius:14px;padding:8px 14px;flex:none}
  .top .total{font-size:44px;font-weight:800;line-height:1}
  .top .total small{font-size:15px;font-weight:600;color:var(--ink-dim);display:block;margin-bottom:2px}
  .top .meta{text-align:right;font-size:15px;color:var(--ink-dim);line-height:1.35}
  .top .meta b{color:var(--ink);font-size:17px}
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .stage .on{font-size:15px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em}
  .stage .num{font-size:clamp(84px,24dvh,168px);font-weight:800;line-height:.95}
  .slots{display:flex;gap:10px;margin-top:8px}
  .slot{width:64px;height:64px;border-radius:14px;background:var(--panel);display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;color:var(--ink-dim);border:2px solid transparent}
  .slot.next{border-color:var(--accent)}
  .slot.hit{color:var(--ink)}
  .slot.v0{background:var(--miss)} .slot.v1{background:var(--single);color:#fff} .slot.v2{background:var(--double);color:#1a1006} .slot.v3{background:var(--treble);color:var(--accent-ink)}
  .prev{font-size:15px;color:var(--ink-dim);min-height:1.4em;margin-top:6px}
  .prev b{color:var(--ink)}
  /* Single, double and treble side by side in board order, the way every other darts app
     puts them, so muscle memory carries over. Miss and Undo sit underneath. */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
  .pad button{min-height:clamp(70px,12dvh,104px);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.05}
  .pad button small{font-size:15px;font-weight:600;opacity:.85}
  .pad .single{background:var(--single);color:#fff}
  .pad .double{background:var(--double);color:#1a1006}
  .pad .treble{background:var(--treble);color:var(--accent-ink)}
  .under{display:flex;gap:10px;flex:none}
  .under button{flex:1;min-height:clamp(60px,9dvh,84px);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
  .under button small{font-size:15px;font-weight:600;opacity:.85}
  .under .undo{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.22)}
  .under .miss{background:var(--miss);color:var(--ink)}
  .quitrow{display:flex;flex:none}
  .quitrow button{flex:1;min-height:56px;font-size:16px}
  .quitrow .quit.arm{background:var(--danger);color:#fff;border-color:transparent}
  @media (max-height:700px){
    .stage .on{display:none}
    .slot{width:56px;height:56px;font-size:26px}
    .prev{margin-top:2px}
    .finish .big{font-size:clamp(56px,13dvh,90px)}
    .finish .sub{font-size:16px}
    .guidehead{margin:2px 0 6px}
  }

  /* ---- finish ---- */
  /* The score and the buttons are fixed; the guide in between scrolls if it has to. */
  .finish{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px;text-align:center}
  .finish .head{flex:none;display:flex;flex-direction:column;gap:4px;padding-top:4px}
  .finish .big{font-size:clamp(64px,17dvh,120px);font-weight:800;line-height:1}
  .finish .sub{color:var(--ink-dim);font-size:17px}
  .finish .band{font-size:21px;font-weight:800;color:var(--accent)}
  .finish .next{color:var(--ink-dim);font-size:15px}
  .finish .scroll{flex:1;min-height:0;overflow-y:auto;margin-top:4px}
  .finish .row{width:100%;margin-top:10px;flex:none}
  .guidehead{flex:none;font-size:15px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 8px}
  ul.guide{list-style:none;display:flex;flex-direction:column;gap:6px;text-align:left}
  ul.guide li{display:flex;align-items:baseline;gap:12px;background:var(--panel);border-radius:12px;padding:8px 12px;border:2px solid transparent}
  ul.guide li.on{border-color:var(--accent);background:var(--panel-lift)}
  ul.guide .r{font-weight:800;font-size:16px;min-width:4.6rem;color:var(--ink-dim)}
  ul.guide li.on .r{color:var(--accent)}
  ul.guide .n{flex:1;font-size:16px}
  ul.guide li.on .n{font-weight:700}
  ul.guide .n small{display:block;color:var(--ink-dim);font-size:15px;font-weight:400;line-height:1.3}

  .toast{
    pointer-events:none;
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;
    background:var(--panel-lift);color:var(--ink);padding:14px 20px;border-radius:14px;
    font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header>
  <h1>Around the Clock</h1>
  <div class="user" id="userBox"></div>
</header>

<main id="main">
  <section class="gate hidden" id="gate">
    <p id="gateMsg">Sign in to keep your scores.</p>
    <button id="signInBig">Sign in with Google</button>
  </section>

  <section class="hidden" id="home">
    <div class="resume hidden" id="resume">
      <div class="t"><b id="resumeL1"></b><small id="resumeL2"></small></div>
      <button class="lift" id="resumeBtn">Resume</button>
    </div>

    <h2 class="sect">180 Around the Clock</h2>
    <div class="chips" id="whoChips"></div>
    <div class="seg" id="dirSeg">
      <button type="button" data-dir="up" aria-pressed="true">1 → 20</button>
      <button type="button" data-dir="down" aria-pressed="false">20 → 1</button>
    </div>
    <div class="row">
      <button class="big" id="startBtn">Start</button>
    </div>
    <p class="hint">Three darts at each number. Single 1 · Double 2 · Treble 3 · anything else 0. Max 180.</p>

    <h2 class="sect">Progress</h2>
    <div class="chips" id="progChips"></div>
    <div id="progress"></div>

    <h2 class="sect">Recent</h2>
    <ul class="list" id="recent"></ul>

    <h2 class="sect">Players</h2>
    <ul class="list people" id="people"></ul>
    <div class="addbox">
      <label for="newName">Name</label>
      <input type="text" id="newName" placeholder="Sergio" autocomplete="off">
      <label for="newEmail">Their Gmail, so they can sign in (optional)</label>
      <input type="email" id="newEmail" placeholder="name@gmail.com" autocomplete="off" inputmode="email">
      <div class="row">
        <button class="quiet" id="shareBtn">Share link</button>
        <button id="addBtn">Add player</button>
      </div>
    </div>

    <div class="row">
      <button class="quiet" id="exportBtn">Export</button>
      <button class="quiet" id="importBtn">Import</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
    <div id="installHere"></div>
  </section>

  <section class="game hidden" id="game">
    <div class="top">
      <div class="total"><small id="gPlayer"></small><span id="gTotal">0</span></div>
      <div class="meta"><b id="gDart"></b><br><span id="gDir"></span></div>
    </div>
    <div class="stage">
      <div class="on">on</div>
      <div class="num" id="gNum">1</div>
      <div class="slots"><div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div></div>
      <div class="prev" id="gPrev"></div>
    </div>
    <div class="pad">
      <button type="button" class="single" data-v="1"><span id="lS">S1</span><small>+1</small></button>
      <button type="button" class="double" data-v="2"><span id="lD">D1</span><small>+2</small></button>
      <button type="button" class="treble" data-v="3"><span id="lT">T1</span><small>+3</small></button>
    </div>
    <div class="under">
      <button type="button" class="undo" id="undoBtn">Undo</button>
      <button type="button" class="miss" data-v="0">Miss<small>0</small></button>
    </div>
    <div class="quitrow">
      <button type="button" class="quiet quit" id="quitBtn">Abandon</button>
    </div>
  </section>

  <section class="finish hidden" id="finish">
    <div class="head">
      <div class="sub" id="fWho"></div>
      <div class="big" id="fScore">0</div>
      <div class="sub" id="fNote"></div>
      <div class="band" id="fBand"></div>
      <div class="next" id="fNext"></div>
    </div>
    <h2 class="guidehead">Guide to your performance</h2>
    <div class="scroll">
      <ul class="guide" id="fGuide"></ul>
    </div>
    <div class="row">
      <button class="quiet" id="doneBtn">Done</button>
      <button id="againBtn">Play again</button>
    </div>
  </section>
</main>

<footer>Around the Clock <span id="version"></span></footer>

<script type="module">
  import { cloud } from "../shared/cloud.js";
  import { phone } from "../shared/phone.js";

  // Bump on every change. The deploy skill checks this against the live site.
  const APP_VERSION = "0.3.0";
  const APP_ID = "around-the-clock";
  document.getElementById("version").textContent = "v" + APP_VERSION;

  const $ = id => document.getElementById(id);

  // ---- the drill ----
  const GAME = "atc180";
  const DARTS_PER = 3, NUMBERS = 20, TOTAL_DARTS = DARTS_PER * NUMBERS, MAX = 180;
  const order = dir => Array.from({ length: NUMBERS }, (_, i) => dir === "down" ? NUMBERS - i : i + 1);
  const dirLabel = dir => dir === "down" ? "20 → 1" : "1 → 20";
  const sum = arr => arr.reduce((a, b) => a + b, 0);
  const HIT = ["Miss", "Single", "Double", "Treble"];

  // ---- state ----
  let players = {};           // id -> { name, email, createdAt, deleted }
  let games = [];             // { id, game, player, direction, darts, score, at, endedAt, status, by }
  let direction = "up";
  let unsubs = [];
  let who = null;             // player selected on Home
  let progWho = null;         // player shown in Progress
  let live = null;            // the game being played on this phone: { id, player, direction, darts, at, status, by }
  let finished = null;        // the game just completed, shown on the finish panel

  const myEmail = () => ((cloud.user && cloud.user.email) || "").toLowerCase();
  const isMe = p => !!myEmail() && (p.email || "").toLowerCase() === myEmail();
  const activePlayers = () => Object.entries(players)
    .filter(([, p]) => p && !p.deleted)
    .map(([id, p]) => ({ id, ...p }))
    .sort((a, b) => (isMe(b) - isMe(a)) || (a.createdAt || 0) - (b.createdAt || 0));
  const nameOf = id => (players[id] && players[id].name) || "Someone";
  const myPlayerId = () => { const hit = activePlayers().find(isMe); return hit ? hit.id : null; };

  // ---- you are a player by default (same approach as Bloc 11) ----
  let meHandled = null;
  let stateLoaded = false;
  async function ensureMe(){
    const u = cloud.user;
    if (!u || !u.email || !store.live || !stateLoaded) return;
    const email = u.email.toLowerCase();
    if (meHandled === email) return;
    if (myPlayerId()){ meHandled = email; return; }
    meHandled = email;
    const lower = x => String(x || "").trim().toLowerCase();
    const first = (u.displayName || email.split("@")[0]).trim().split(/\s+/)[0];
    const byName = () => activePlayers().find(p => !p.email && (lower(p.name) === lower(first) || lower(p.name) === lower(u.displayName)));
    let match = byName();
    if (!match){
      await new Promise(r => setTimeout(r, 2500));   // let a fresh phone's list land before adding anyone
      if (myPlayerId()) return;
      match = byName();
    }
    try {
      if (match){
        await store.savePlayers({ ...players, [match.id]: { ...players[match.id], email } });
        toast(`You're ${match.name}`);
      } else {
        await store.addPlayer({ name: first, email, createdAt: Date.now() });
        toast(`Added you as ${first}`);
      }
    } catch (e){ meHandled = null; toast("Couldn't set you up as a player: " + (e.message || e)); return; }
    who = myPlayerId();
    renderHome();
  }

  // ---- taps: pointerup, not click ----
  function tap(node, fn){
    if (!node) return;
    let down = false, sx = 0, sy = 0;
    node.addEventListener("pointerdown", e => { down = true; sx = e.clientX; sy = e.clientY; });
    node.addEventListener("pointercancel", () => { down = false; });
    node.addEventListener("pointerup", e => {
      if (!down) return;
      down = false;
      if (Math.abs(e.clientX - sx) > 14 || Math.abs(e.clientY - sy) > 14) return; // a scroll, not a tap
      e.preventDefault();
      fn(e);
    });
    node.addEventListener("click", e => e.preventDefault());
  }
  function buzz(ms){ if (navigator.vibrate) navigator.vibrate(ms); }

  // Two-tap delete: first tap arms it for five seconds, second tap does it.
  function armed(btn, label, fn){
    let timer = null;
    tap(btn, async () => {
      if (!timer){
        timer = setTimeout(() => { timer = null; btn.classList.remove("arm"); btn.textContent = label; }, 5000);
        btn.classList.add("arm");
        btn.textContent = "Sure?";
        buzz(12);
        return;
      }
      clearTimeout(timer); timer = null;
      btn.disabled = true; btn.textContent = "…";
      try { await fn(); }
      catch (e){ toast("Couldn't do that: " + (e.message || e)); }
      btn.disabled = false; btn.classList.remove("arm"); btn.textContent = label;
    });
  }

  // ---- dates ----
  const DAY = 86400000;
  const startOfDay = ms => { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
  const daysSince = ms => Math.round((startOfDay(Date.now()) - startOfDay(ms)) / DAY);
  const pad = n => String(n).padStart(2, "0");
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const shortDate = ms => new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short" });
  function whenLabel(ms){
    const n = daysSince(ms);
    const t = new Date(ms).toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
    if (n <= 0) return `Today ${t}`;
    if (n === 1) return `Yesterday ${t}`;
    if (n < 7) return new Date(ms).toLocaleDateString(undefined, { weekday:"long" });
    return new Date(ms).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
  }

  // ---- screens ----
  function show(which){
    for (const id of ["home", "game", "finish"]) $(id).classList.toggle("hidden", id !== which);
    document.body.classList.toggle("playing", which !== "home");
  }

  // Fullscreen, the wake lock and the install button all live in shared/phone.js so every
  // app in the repo behaves the same way on a handset.
  phone.keepAwake(true);
  phone.mountInstall($("installHere"), { label: "Install on this phone" });

  // ---- home ----
  function renderHome(){
    renderWho();
    renderDir();
    renderResume();
    renderProgress();
    renderRecent();
    renderPeople();
  }

  function chipRow(wrap, selectedId, onPick){
    wrap.innerHTML = "";
    const list = activePlayers();
    if (!list.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Add a player below to get started.";
      wrap.appendChild(p);
      return;
    }
    for (const p of list){
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = isMe(p) ? `${p.name} (you)` : p.name;
      b.setAttribute("aria-pressed", p.id === selectedId ? "true" : "false");
      tap(b, () => onPick(p.id));
      wrap.appendChild(b);
    }
  }

  function renderWho(){
    const list = activePlayers();
    if (!who || !players[who] || players[who].deleted) who = myPlayerId() || (list[0] && list[0].id) || null;
    chipRow($("whoChips"), who, id => { who = id; renderWho(); });
  }

  function renderDir(){
    $("dirSeg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.dir === direction ? "true" : "false"));
  }

  // A game left mid-way (on this phone or another) is offered back rather than lost.
  const liveGames = () => games.filter(g => g.status === "live").sort((a, b) => b.at - a.at);

  // The game this phone was playing is remembered locally, so when the app is reopened
  // (screen off, app killed, reload) it drops straight back in without a tap. A game
  // started on another phone is only offered, via the Resume banner.
  const LIVE_KEY = APP_ID + ".live";
  const remember = id => { try { id ? localStorage.setItem(LIVE_KEY, id) : localStorage.removeItem(LIVE_KEY); } catch {} };
  const remembered = () => { try { return localStorage.getItem(LIVE_KEY); } catch { return null; } };
  let autoResumed = false;   // once per load: after Done or Abandon, Home stays Home
  function autoResume(){
    if (autoResumed || live || finished) return;
    autoResumed = true;
    const id = remembered();
    if (!id) return;
    const g = games.find(x => x.id === id);
    if (g && g.status === "live" && g.darts.length < TOTAL_DARTS) resumeGame(g);
    else remember(null);   // finished or deleted elsewhere, or never made it to the cloud
  }
  function renderResume(){
    const g = liveGames()[0];
    $("resume").classList.toggle("hidden", !g);
    if (!g) return;
    $("resumeL1").textContent = `${nameOf(g.player)} · ${sum(g.darts)} after ${g.darts.length} dart${g.darts.length === 1 ? "" : "s"}`;
    $("resumeL2").textContent = `${dirLabel(g.direction)} · ${whenLabel(g.at)}`;
  }

  // ---- progress ----
  const doneFor = id => games.filter(g => g.status === "done" && g.player === id).sort((a, b) => a.at - b.at);
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

  // Roughly where a score sits. Anchored on the two numbers this drill is always quoted
  // with — 60 is a single on every dart, and a regular player aims at 75–80 — with the
  // rest spaced out from there. Edit the list and the finish screen follows.
  const BANDS = [
    { at: 130, name: "Professional territory", note: "A treble on better than one dart in three, all the way round." },
    { at: 110, name: "County standard",        note: "Trebles coming steadily on every part of the board." },
    { at: 90,  name: "Strong league player",   note: "Well past the target most club players set themselves." },
    { at: 75,  name: "Regular player",         note: "The 75–80 a club player aims at." },
    { at: 60,  name: "Solid club standard",    note: "Sixty is a single on every single dart." },
    { at: 45,  name: "Finding the numbers",    note: "Most darts landing on the number you're on." },
    { at: 0,   name: "Building the round",     note: "The awkward numbers count the same as the 20 — keep going." }
  ];
  const bandFor = score => BANDS.find(b => score >= b.at);
  const bandRange = i => i === 0 ? BANDS[0].at + "+" : `${BANDS[i].at}–${BANDS[i - 1].at - 1}`;

  function renderGuide(score){
    const ul = $("fGuide");
    ul.innerHTML = "";
    const mine = bandFor(score);
    BANDS.forEach((b, i) => {
      const li = document.createElement("li");
      const here = b === mine;
      li.classList.toggle("on", here);
      li.innerHTML = `<span class="r"></span><span class="n"><span></span><small></small></span>`;
      li.querySelector(".r").textContent = bandRange(i);
      li.querySelector(".n span").textContent = b.name;
      // Only the band you landed in explains itself; the rest stay one line each so the
      // whole ladder fits, and yours is scrolled into view below.
      if (here) li.querySelector("small").textContent = b.note;
      else li.querySelector("small").remove();
      ul.appendChild(li);
    });
  }
  const fmtAvg = n => (Math.round(n * 10) / 10).toString();

  function renderProgress(){
    const list = activePlayers();
    if (!progWho || !players[progWho] || players[progWho].deleted) progWho = who || (list[0] && list[0].id) || null;
    chipRow($("progChips"), progWho, id => { progWho = id; renderProgress(); });
    const box = $("progress");
    box.innerHTML = "";
    if (!progWho) return;

    const mine = doneFor(progWho);
    if (!mine.length){
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = `No games for ${nameOf(progWho)} yet.`;
      box.appendChild(p);
      return;
    }
    const scores = mine.map(g => g.score);
    const best = Math.max(...scores);
    const last10 = scores.slice(-10);

    const tiles = document.createElement("div");
    tiles.className = "tiles";
    tiles.innerHTML = `
      <div class="tile"><b></b><span>best</span></div>
      <div class="tile"><b></b><span>last<br>game</span></div>
      <div class="tile"><b></b><span>average<br>last ${last10.length}</span></div>`;
    const bs = tiles.querySelectorAll("b");
    bs[0].textContent = String(best);
    bs[1].textContent = String(scores[scores.length - 1]);
    bs[2].textContent = fmtAvg(avg(last10));
    box.appendChild(tiles);
    box.appendChild(chart(mine));
  }

  // Score per game over time, with a dotted line at the running average of the last ten.
  function chart(mine){
    const wrap = document.createElement("div");
    wrap.className = "chart";
    const W = Math.max(280, Math.min(640, ($("progress").clientWidth || 340) - 16));
    const H = 220, L = 40, R = 16, T = 16, B = 30;
    const iw = W - L - R, ih = H - T - B;
    const top = Math.min(MAX, Math.max(60, Math.ceil(Math.max(...mine.map(g => g.score)) / 20) * 20));
    const n = mine.length;
    const X = i => n === 1 ? L + iw / 2 : L + i / (n - 1) * iw;
    const Y = s => T + ih - s / top * ih;

    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scores over time">`;
    for (let v = 0; v <= top; v += top / 4){
      s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
      s += `<text x="${L - 8}" y="${Y(v) + 5}" text-anchor="end" font-size="15" fill="var(--ink-dim)">${Math.round(v)}</text>`;
    }
    const first = mine[0].at, last = mine[n - 1].at;
    s += `<text x="${X(0)}" y="${H - 8}" text-anchor="${n === 1 ? "middle" : "start"}" font-size="15" fill="var(--ink-dim)">${shortDate(first)}</text>`;
    if (n > 1 && startOfDay(first) !== startOfDay(last))
      s += `<text x="${X(n - 1)}" y="${H - 8}" text-anchor="end" font-size="15" fill="var(--ink-dim)">${shortDate(last)}</text>`;
    if (n > 1){
      const roll = mine.map((_, i) => avg(mine.slice(Math.max(0, i - 9), i + 1).map(g => g.score)));
      s += `<polyline fill="none" stroke="var(--ink-dim)" stroke-width="2" stroke-dasharray="4 5" opacity=".8" points="${roll.map((v, i) => `${X(i)},${Y(v)}`).join(" ")}"/>`;
      s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".8" points="${mine.map((g, i) => `${X(i)},${Y(g.score)}`).join(" ")}"/>`;
    }
    for (let i = 0; i < n; i++)
      s += `<circle cx="${X(i)}" cy="${Y(mine[i].score)}" r="${n > 30 ? 3.5 : 5.5}" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>`;
    s += `</svg>`;
    wrap.innerHTML = s + `<div class="cap">${n === 1 ? "One game so far" : `${n} games · dotted line is the rolling average`}</div>`;
    return wrap;
  }

  // ---- recent ----
  function renderRecent(){
    const ul = $("recent");
    ul.innerHTML = "";
    const rows = [...games].sort((a, b) => b.at - a.at).slice(0, 30);
    if (!rows.length){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No games yet.";
      ul.appendChild(li);
      return;
    }
    for (const g of rows){
      const isLive = g.status === "live";
      const li = document.createElement("li");
      li.innerHTML = `<span class="score"></span>
        <span class="who"><div class="l1"></div><div class="l2"></div></span>
        <button type="button" class="x" aria-label="Delete">✕</button>`;
      const sc = li.querySelector(".score");
      sc.textContent = isLive ? "live" : String(g.score);
      sc.classList.toggle("live", isLive);
      li.querySelector(".l1").textContent = `${nameOf(g.player)} · ${dirLabel(g.direction)}`;
      li.querySelector(".l2").textContent = isLive
        ? `${whenLabel(g.at)} · ${sum(g.darts)} after ${g.darts.length} darts`
        : `${whenLabel(g.at)} · ${g.darts.filter(d => d === 3).length} trebles · ${g.darts.filter(d => d === 0).length} misses`;
      armed(li.querySelector("button"), "✕", () => store.removeGame(g.id));
      ul.appendChild(li);
    }
  }

  // ---- players ----
  function renderPeople(){
    const ul = $("people");
    ul.innerHTML = "";
    const list = activePlayers();
    if (!list.length){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No players yet. Add yourself first.";
      ul.appendChild(li);
      return;
    }
    for (const p of list){
      const li = document.createElement("li");
      li.innerHTML = `<span class="who"><div class="l1"></div><div class="l2"></div></span>`;
      li.querySelector(".l1").textContent = p.name;
      const n = doneFor(p.id).length;
      li.querySelector(".l2").textContent = `${n} game${n === 1 ? "" : "s"}${p.email ? " · " + p.email : ""}`;
      if (isMe(p)){
        const y = document.createElement("span");
        y.className = "you";
        y.textContent = "you";
        li.appendChild(y);
      } else {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = "Remove";
        armed(b, "Remove", () => store.removePlayer(p.id));
        li.appendChild(b);
      }
      ul.appendChild(li);
    }
  }

  async function addPlayer(){
    const name = $("newName").value.trim();
    const email = $("newEmail").value.trim().toLowerCase();
    if (!name){ $("newName").focus(); return; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("That email doesn't look right."); $("newEmail").focus(); return; }
    $("addBtn").disabled = true;
    try {
      const id = await store.addPlayer({ name, email, createdAt: Date.now() });
      $("newName").value = ""; $("newEmail").value = "";
      if (!who) who = id;
      let msg = `${name} added`;
      if (email && store.live){
        try { await cloud.addMember(email); msg += " · they can sign in now"; }
        catch (e){ msg += " · couldn't add their email to the family list"; }
      }
      toast(msg);
    } catch (e){ toast("Couldn't add: " + (e.message || e)); }
    $("addBtn").disabled = false;
  }

  function share(){
    const url = location.origin + location.pathname;
    if (navigator.share){
      navigator.share({ title:"Around the Clock", text:"Darts drill scorer — sign in with the Gmail that's been added.", url }).catch(() => {});
    } else if (navigator.clipboard){
      navigator.clipboard.writeText(url).then(() => toast("Link copied")).catch(() => {});
    }
  }

  // ---- the game ----
  function startGame(){
    if (!who){ toast("Add a player first."); return; }
    live = {
      id: store.newId(), game: GAME, player: who, direction, darts: [],
      score: 0, at: Date.now(), endedAt: null, status: "live", by: cloud.user ? cloud.user.email : null
    };
    store.saveGame(live).catch(e => toast("Couldn't save: " + (e.message || e)));
    remember(live.id);
    phone.fullscreen();
    show("game");
    renderGame();
  }

  function resumeGame(which){
    const g = which || liveGames()[0];
    if (!g) return;
    live = { ...g, darts: [...g.darts] };
    remember(live.id);
    phone.fullscreen();
    show("game");
    renderGame();
  }

  function renderGame(){
    if (!live) return;
    const darts = live.darts;
    const idx = Math.floor(darts.length / DARTS_PER);
    const nums = order(live.direction);
    $("gPlayer").textContent = nameOf(live.player);
    $("gTotal").textContent = String(sum(darts));
    $("gDart").textContent = `Dart ${Math.min(darts.length + 1, TOTAL_DARTS)} of ${TOTAL_DARTS}`;
    $("gDir").textContent = dirLabel(live.direction);
    const on = nums[Math.min(idx, NUMBERS - 1)];
    $("gNum").textContent = String(on);
    $("lS").textContent = "S" + on;
    $("lD").textContent = "D" + on;
    $("lT").textContent = "T" + on;
    const cur = darts.slice(idx * DARTS_PER, idx * DARTS_PER + DARTS_PER);
    for (let i = 0; i < DARTS_PER; i++){
      const el = $("s" + i);
      el.className = "slot";
      if (i < cur.length){ el.textContent = String(cur[i]); el.classList.add("hit", "v" + cur[i]); }
      else { el.textContent = "·"; if (i === cur.length) el.classList.add("next"); }
    }
    const prev = $("gPrev");
    if (idx > 0){
      const p = darts.slice((idx - 1) * DARTS_PER, idx * DARTS_PER);
      prev.innerHTML = `<b></b> · <span></span> · +<b></b>`;
      const bs = prev.querySelectorAll("b");
      bs[0].textContent = String(nums[idx - 1]);
      prev.querySelector("span").textContent = p.map(v => HIT[v]).join(", ");
      bs[1].textContent = String(sum(p));
    } else {
      prev.textContent = "Three darts, then it moves on by itself.";
    }
    $("undoBtn").disabled = darts.length === 0;
  }

  function throwDart(v){
    if (!live || live.darts.length >= TOTAL_DARTS) return;
    live.darts.push(v);
    buzz(v === 3 ? [15, 30, 15] : 10);
    if (live.darts.length >= TOTAL_DARTS) return finishGame();
    renderGame();
    persistLive();
  }

  function undo(){
    if (!live || !live.darts.length) return;
    live.darts.pop();
    buzz(8);
    renderGame();
    persistLive();
  }

  function persistLive(){
    live.score = sum(live.darts);
    store.saveGame(live).catch(e => toast("Couldn't save: " + (e.message || e)));
  }

  async function finishGame(){
    live.score = sum(live.darts);
    live.status = "done";
    live.endedAt = Date.now();
    finished = live;
    live = null;
    remember(null);
    buzz([30, 40, 30, 40, 60]);
    try { await store.saveGame(finished); }
    catch (e){ toast("Couldn't save: " + (e.message || e)); }
    show("finish");
    renderFinish();
  }

  function renderFinish(){
    const g = finished;
    if (!g) return;
    $("fWho").textContent = `${nameOf(g.player)} · ${dirLabel(g.direction)}`;
    $("fScore").textContent = String(g.score);
    const others = doneFor(g.player).filter(x => x.id !== g.id).map(x => x.score);
    const trebles = g.darts.filter(d => d === 3).length;
    let note = `${trebles} treble${trebles === 1 ? "" : "s"} · ${g.darts.filter(d => d === 0).length} misses`;
    if (!others.length) note += " · first game on the board";
    else if (g.score > Math.max(...others)) note += ` · new best (was ${Math.max(...others)})`;
    else note += ` · best ${Math.max(...others)} · average ${fmtAvg(avg(others.slice(-10)))}`;
    $("fNote").textContent = note;

    const band = bandFor(g.score);
    $("fBand").textContent = band.name;
    const up = BANDS[BANDS.indexOf(band) - 1];
    $("fNext").textContent = up
      ? `${up.at - g.score} more for ${up.name.toLowerCase()}`
      : "Nothing above this — that's the top of the guide.";
    renderGuide(g.score);
    // Put your own row where you can see it, whatever the height of the phone.
    const row = $("fGuide").querySelector("li.on");
    if (row && row.scrollIntoView) requestAnimationFrame(() => row.scrollIntoView({ block: "center" }));
  }

  async function abandonGame(){
    const g = live;
    live = null;
    remember(null);
    show("home");
    renderHome();
    if (g) await store.removeGame(g.id);
  }

  function leaveToHome(){
    live = null; finished = null;
    remember(null);
    show("home");
    renderHome();
  }

  function toast(msg){
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  function download(name, text, type){
    const url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  }

  // ---- export / import ----
  function exportAll(){
    const data = { app: APP_ID, version: APP_VERSION, exportedAt: new Date().toISOString(), players, games };
    download(`around-the-clock-${toISO(new Date())}.json`, JSON.stringify(data, null, 2), "application/json");
  }

  async function importFile(file){
    let data;
    try { data = JSON.parse(await file.text()); }
    catch { return toast("That file isn't JSON."); }
    if (!data || !Array.isArray(data.games)) return toast("No games in that file.");
    let people = 0;
    if (data.players && typeof data.players === "object"){
      const fresh = {};
      for (const [id, p] of Object.entries(data.players)){
        if (!p || !p.name || players[id]) continue;
        fresh[id] = { name: String(p.name), email: String(p.email || ""), createdAt: Number(p.createdAt) || Date.now(), deleted: !!p.deleted };
        people++;
      }
      if (people) await store.savePlayers({ ...players, ...fresh });
    }
    const have = new Set(games.map(g => g.id));
    let added = 0;
    for (const raw of data.games){
      if (!raw || !raw.player || !Array.isArray(raw.darts) || !raw.at) continue;
      const darts = raw.darts.map(Number).filter(v => v >= 0 && v <= 3).slice(0, TOTAL_DARTS);
      const g = {
        id: raw.id && !have.has(raw.id) ? String(raw.id) : store.newId(),
        game: String(raw.game || GAME), player: String(raw.player), direction: raw.direction === "down" ? "down" : "up",
        darts, score: sum(darts), at: Number(raw.at), endedAt: raw.endedAt ? Number(raw.endedAt) : null,
        status: raw.status === "live" && darts.length < TOTAL_DARTS ? "live" : "done", by: raw.by || null
      };
      if (raw.id && have.has(raw.id)) continue;
      have.add(g.id);
      await store.saveGame(g);
      added++;
    }
    toast(added || people ? `Imported ${added} game${added === 1 ? "" : "s"}, ${people} player${people === 1 ? "" : "s"}` : "Nothing new to import");
  }

  // ---- storage ----
  // Cloud when Firebase is set up and signed in; a plain in-memory copy otherwise, so the
  // app still runs (and still exports) if it's ever opened without the cloud.
  const store = {
    get live(){ return cloud.configured() && !!cloud.user; },
    newId(){ return this.live ? cloud.newId() : "local-" + Math.random().toString(36).slice(2); },
    async saveGame(g){
      const { id, ...doc } = g;
      if (this.live) return cloud.save(`games/${id}`, doc);
      games = [...games.filter(x => x.id !== id), { ...g }];
      if (!document.body.classList.contains("playing")) renderHome();
    },
    async removeGame(id){
      if (this.live) return cloud.delete(`games/${id}`);
      games = games.filter(x => x.id !== id);
      renderHome();
    },
    async savePlayers(next){
      players = next;
      if (this.live) return cloud.save("state/main", { players: next });
      renderHome();
    },
    async addPlayer(p){
      const id = this.newId();
      await this.savePlayers({ ...players, [id]: p });
      return id;
    },
    async removePlayer(id){
      if (!players[id]) return;
      await this.savePlayers({ ...players, [id]: { ...players[id], deleted: true } });
    },
    async saveDirection(dir){
      direction = dir;
      if (this.live) return cloud.save("state/main", { direction: dir });
    }
  };

  // ---- wiring ----
  tap($("startBtn"), startGame);
  tap($("resumeBtn"), () => resumeGame());
  $("dirSeg").querySelectorAll("button").forEach(b => tap(b, () => { store.saveDirection(b.dataset.dir).catch(() => {}); renderDir(); }));
  $("game").querySelectorAll("[data-v]").forEach(b => tap(b, () => throwDart(Number(b.dataset.v))));
  tap($("undoBtn"), undo);
  armed($("quitBtn"), "Abandon", abandonGame);
  tap($("doneBtn"), leaveToHome);
  tap($("againBtn"), () => { who = finished ? finished.player : who; direction = finished ? finished.direction : direction; finished = null; startGame(); });
  tap($("addBtn"), addPlayer);
  tap($("shareBtn"), share);
  tap($("exportBtn"), exportAll);
  tap($("importBtn"), () => $("importFile").click());
  $("importFile").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (f) importFile(f);
  });
  $("newName").addEventListener("keydown", e => { if (e.key === "Enter") $("newEmail").focus(); });
  $("newEmail").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });

  // ---- cloud ----
  const userBox = $("userBox");
  await cloud.init(APP_ID);

  function applyUser(user){
    if (user) {
      userBox.innerHTML = `${user.photoURL ? `<img src="${user.photoURL}" alt="">` : ""}<button class="quiet" id="signOut" style="min-height:44px;padding:0 14px;font-size:15px">Sign out</button>`;
      tap($("signOut"), () => cloud.signOut());
    } else {
      userBox.innerHTML = "";
    }
    start(user);
  }

  // onUser only fires straight away when someone is signed in, so paint the signed-out
  // state ourselves. Also what makes the app run before Firebase is set up.
  cloud.onUser(applyUser);
  if (!cloud.user) applyUser(null);

  tap($("signInBig"), () => cloud.signIn().catch(err => {
    $("gateMsg").textContent = "Sign-in failed: " + (err && err.code ? err.code : err);
  }));

  // ---- app ----
  function start(user){
    unsubs.forEach(u => { try { u(); } catch {} });
    unsubs = [];
    who = null; progWho = null; meHandled = null; stateLoaded = false; live = null; finished = null; autoResumed = false;

    const gated = cloud.configured() && !user;
    $("gate").classList.toggle("hidden", !gated);
    document.body.classList.remove("playing");
    for (const id of ["home", "game", "finish"]) $(id).classList.add("hidden");
    if (gated) return;
    show("home");

    if (cloud.configured()){
      unsubs.push(cloud.watch("state/main", doc => {
        players = (doc && doc.players) || {};
        if (doc && (doc.direction === "up" || doc.direction === "down")) direction = doc.direction;
        stateLoaded = true;
        if (!live) renderHome();
        ensureMe();
      }));
      unsubs.push(cloud.watchList("games", rows => {
        games = rows
          .filter(r => typeof r.at === "number" && Array.isArray(r.darts))
          .map(r => ({ ...r, darts: r.darts.map(Number), score: typeof r.score === "number" ? r.score : sum(r.darts.map(Number)) }));
        // The game on this phone is the truth while it's being played; the list only
        // matters for Home. If someone else deleted it out from under us, drop out cleanly.
        if (live && !games.some(g => g.id === live.id) && live.darts.length){ toast("That game was deleted elsewhere."); live = null; remember(null); show("home"); }
        if (!live) autoResume();
        if (!live) renderHome();
      }, { orderBy: "at", desc: true, limit: 500 }));
    }
    renderHome();
  }

  // ---- offline shell ----
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>

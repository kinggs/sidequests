# Pocket Instruments: the Rack plugin for all four Rack platforms (PROOFS.md P5).
# Each job links the plugin with its Rust core on that platform's own toolchain, checks the
# finished .vcvplugin against what Rack's toolchain builds for (pocket-instruments/rack/
# check-dist.sh), and uploads it. The four files are under "Artifacts" on the run's page.
# They are unsigned test builds for loading by hand, not releases.
# Native runners, as Phona does (REFERENCES.md R16a); Linux inside Ubuntu 16.04 for glibc 2.23.
name: Pocket Instruments Rack plugin

on:
  push:
    branches: [main]
    paths:
      - pocket-instruments/core/**
      - pocket-instruments/fixtures/**
      - pocket-instruments/rack/**
      - pocket-instruments/design/panel.svg
      - pocket-instruments/design/fonts/**
      - pocket-instruments/Cargo.*
      - pocket-instruments/rust-toolchain.toml
      - pocket-instruments/mise.toml
      - pocket-instruments/Makefile
      - .github/workflows/pocket-instruments-rack.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: lin-x64
            os: ubuntu-latest
            sdk_sha256: 420da2452def7b195f98e3a0650c35f1e0f058a98a71840b4347d3d203618532
          - platform: win-x64
            os: windows-latest
            sdk_sha256: 12f2043311db98592bdf73a7797e8a957c47950c3c8c17c7ff6421eb0015a05c
          # Cross-built on GitHub's Apple Silicon runner, with the Intel SDK.
          - platform: mac-x64
            os: macos-latest
            cross: x86_64-apple-darwin
            sdk_sha256: 9b8b0d7582ca25fac879f8f64de40f2481df2fd903b65f3abb5d6801689060ec
          - platform: mac-arm64
            os: macos-latest
            sdk_sha256: 29414e52417992cbafa47e30f947c3c0c7a34e5c424bb83c5a0af8c24840481f
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # A normal run takes under 2 minutes. On 2026-11-23 the Linux job sat silent for 11 minutes
    # in the Ubuntu 16.04 container's apt; without this it could have run for GitHub's 6 hours.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Windows: keep LF endings, or make and sh read a stray \r.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Rack SDK
        run: |
          mkdir -p sdk
          curl -fsSL -o sdk/sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip"
          sum=sha256sum; command -v sha256sum >/dev/null || sum="shasum -a 256"
          echo "${{ matrix.sdk_sha256 }}  sdk/sdk.zip" | $sum -c -
          unzip -q sdk/sdk.zip -d sdk

      - name: Build (Linux, in Ubuntu 16.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/w ubuntu:16.04 sh /w/pocket-instruments/rack/ci-linux.sh /w/sdk/Rack-SDK
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Rust (Windows, macOS)
        if: runner.os != 'Linux'
        working-directory: pocket-instruments
        run: |
          rustup toolchain install
          rustc --version

      - name: MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit # so make finds cargo and rustup
          install: >-
            make tar zstd unzip jq
            mingw-w64-x86_64-gcc

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C pocket-instruments/rack -j4 dist RACK_DIR="$PWD/sdk/Rack-SDK"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v zstd >/dev/null && command -v jq >/dev/null || brew install zstd jq
          make -C pocket-instruments/rack -j4 dist RACK_DIR="$PWD/sdk/Rack-SDK" ${{ matrix.cross && format('CROSS_COMPILE={0}', matrix.cross) || '' }} 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          # PROOFS.md P5, item 2: what the linker says about the core's 10.12 stamp (Rack asks for 10.9).
          { echo "What rustc and the linker warned (${{ matrix.platform }}):"; grep -i 'warning' build.log || echo "(nothing)"; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -o pipefail
          sh pocket-instruments/rack/check-dist.sh pocket-instruments/rack/dist/*.vcvplugin | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          sh pocket-instruments/rack/check-dist.sh pocket-instruments/rack/dist/*.vcvplugin | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: PocketInstruments-${{ matrix.platform }}
          path: pocket-instruments/rack/dist/*.vcvplugin
          if-no-files-found: error

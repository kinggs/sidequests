<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061a14">
<title>Rack It has moved</title>
<!-- Fair Nine became Rack It and moved to ../rack-it/ (Rack It 2.0.0). This page is all that's
     left here: it points old home-screen icons at the new address. No manifest and no icons,
     so nobody can install this address again. Delete the folder with /deletequest a month on. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
  body{min-height:100dvh;background:#061a14;color:#efe9dc;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:18px;line-height:1.5;display:flex;flex-direction:column;justify-content:center;gap:22px;
    padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));max-width:30rem;margin:0 auto}
  h1{font-size:30px;font-weight:800;line-height:1.2}
  p{color:#bcc7c0}
  ol{padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
  li{padding-left:.2em}
  b{color:#efe9dc}
  a{display:flex;align-items:center;justify-content:center;min-height:68px;border-radius:14px;background:#2f6ea8;color:#fff;
    font-size:21px;font-weight:700;text-decoration:none}
  a:focus-visible{outline:3px solid #fff;outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<h1>Rack It has moved</h1>
<p>Same app, same ratings, new address. The icon on your home screen still points at the old one.</p>
<a href="../rack-it/">Open Rack It</a>
<ol>
  <li>Remove the old <b>Rack It</b> icon from your home screen.</li>
  <li>Open Rack It with the button above.</li>
  <li>Tap <b>More</b>, then <b>Install on this phone</b>.</li>
</ol>
<script>
// Belt and braces beside sw.js: drop this address's service worker and cached copies, so the
// old app can never come back from the cache.
if ("serviceWorker" in navigator)
  navigator.serviceWorker.getRegistrations()
    .then(rs => rs.filter(r => /\/fair-nine\/$/.test(r.scope)).forEach(r => r.unregister()))
    .catch(() => {});
if (window.caches)
  caches.keys().then(ks => ks.filter(k => k.startsWith("fair-nine-")).forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
